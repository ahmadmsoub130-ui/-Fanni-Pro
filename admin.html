<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة فني برو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at top right,rgba(37,99,235,.18),transparent 35%),
#07111f;
color:#fff;
min-height:100vh
}

button,input,select,textarea{font-family:inherit}

.hidden{display:none!important}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(7,17,31,.95);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.header-inner{
max-width:1400px;
margin:auto;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.brand-icon{
width:45px;
height:45px;
border-radius:13px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:20px
}

.brand h1{font-size:18px}
.brand span{color:#94a3b8;font-size:12px}

.header-actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.header-btn{
border:1px solid #334155;
background:#0f1d30;
color:#fff;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
text-decoration:none;
font-size:13px
}

main{
max-width:1400px;
margin:auto;
padding:25px 18px 50px
}

.welcome{margin-bottom:22px}

.welcome h2{
font-size:27px;
margin-bottom:6px
}

.welcome p{color:#94a3b8}

.stats{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:14px;
margin-bottom:22px
}

.stat{
background:#0f1d30;
border:1px solid #1e334d;
border-radius:17px;
padding:18px
}

.stat-title{
color:#94a3b8;
font-size:12px;
margin-bottom:8px
}

.stat-number{
font-size:27px;
font-weight:bold
}

.filters{
background:#0f1d30;
border:1px solid #1e334d;
border-radius:17px;
padding:16px;
margin-bottom:20px
}

.filters-grid{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr auto;
gap:9px
}

.filter{
width:100%;
padding:12px;
background:#0b192b;
color:#fff;
border:1px solid #263b54;
border-radius:10px;
outline:none
}

.refresh-btn{
padding:12px 17px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
cursor:pointer;
font-weight:bold
}

.requests-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px
}

.requests-title h3{font-size:20px}

.request-count{
color:#94a3b8;
font-size:13px
}

.requests{
display:grid;
gap:15px
}

.request-card{
background:#0f1d30;
border:1px solid #1e334d;
border-radius:18px;
padding:19px;
overflow:hidden
}

.request-top{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:15px;
margin-bottom:17px
}

.request-number{
font-size:18px;
font-weight:bold;
color:#60a5fa;
margin-bottom:5px
}

.request-date{
color:#64748b;
font-size:11px
}

.badges{
display:flex;
flex-wrap:wrap;
gap:7px
}

.badge{
padding:6px 10px;
border-radius:999px;
font-size:11px;
font-weight:bold;
background:#1e293b;
color:#cbd5e1
}

.badge.new{
background:rgba(59,130,246,.15);
color:#93c5fd
}

.badge.progress{
background:rgba(245,158,11,.15);
color:#fcd34d
}

.badge.done{
background:rgba(34,197,94,.15);
color:#86efac
}

.badge.cancelled{
background:rgba(239,68,68,.15);
color:#fca5a5
}

.request-info{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-bottom:16px
}

.info-box{
background:#0b192b;
border-radius:11px;
padding:12px;
border:1px solid #172a40
}

.info-label{
color:#64748b;
font-size:10px;
margin-bottom:4px
}

.info-value{
color:#e2e8f0;
font-size:13px;
word-break:break-word
}

.description{
background:#0b192b;
padding:13px;
border-radius:11px;
margin-bottom:16px;
color:#cbd5e1;
font-size:13px;
line-height:1.7
}

.controls{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding-top:16px;
border-top:1px solid #1e334d
}

.control label{
display:block;
color:#94a3b8;
font-size:11px;
margin-bottom:6px
}

.control select,
.control input,
.control textarea{
width:100%;
padding:10px;
border-radius:9px;
border:1px solid #263b54;
background:#0b192b;
color:#fff;
outline:none
}

.control textarea{
min-height:70px;
resize:vertical
}

.save-row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-top:14px
}

.save-btn{
border:none;
background:#16a34a;
color:#fff;
border-radius:10px;
padding:11px 18px;
cursor:pointer;
font-weight:bold
}

.save-btn:disabled{
opacity:.5;
cursor:not-allowed
}

.image-link{
display:inline-block;
padding:10px 14px;
border-radius:9px;
background:#1d4ed8;
color:#fff;
text-decoration:none;
font-size:12px
}

.empty{
background:#0f1d30;
border:1px dashed #334155;
padding:45px 20px;
border-radius:18px;
text-align:center;
color:#94a3b8
}

.loading{
text-align:center;
padding:40px;
color:#94a3b8
}

.toast{
position:fixed;
left:18px;
bottom:18px;
z-index:100;
padding:13px 18px;
border-radius:10px;
background:#16a34a;
color:#fff;
display:none;
box-shadow:0 10px 30px rgba(0,0,0,.3)
}

.toast.error{background:#dc2626}

@media(max-width:1000px){
.stats{grid-template-columns:repeat(3,1fr)}
.filters-grid{grid-template-columns:1fr 1fr}
.controls{grid-template-columns:1fr 1fr}
}

@media(max-width:650px){
.header-inner{padding:12px}
.brand h1{font-size:16px}
.brand span{display:none}
main{padding:20px 12px 40px}
.stats{grid-template-columns:repeat(2,1fr)}
.filters-grid{grid-template-columns:1fr}
.request-top{flex-direction:column}
.request-info{grid-template-columns:1fr}
.controls{grid-template-columns:1fr}
.save-row{flex-direction:column;align-items:stretch}
.save-btn,.image-link{text-align:center;width:100%}
.welcome h2{font-size:22px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">

<div class="brand">
<div class="brand-icon">ف</div>
<div>
<h1>فني برو</h1>
<span>لوحة إدارة طلبات الصيانة</span>
</div>
</div>

<div class="header-actions">

<a href="technicians.html" class="header-btn">
إدارة الفنيين
</a>

<button class="header-btn" id="logoutBtn">
تسجيل الخروج
</button>

</div>
</div>
</header>


<main>

<div class="welcome">
<h2>لوحة التحكم</h2>
<p id="adminEmail">جاري تحميل الحساب...</p>
</div>


<div class="stats">

<div class="stat">
<div class="stat-title">كل الطلبات</div>
<div class="stat-number" id="totalCount">0</div>
</div>

<div class="stat">
<div class="stat-title">طلبات جديدة</div>
<div class="stat-number" id="newCount">0</div>
</div>

<div class="stat">
<div class="stat-title">قيد التنفيذ</div>
<div class="stat-number" id="progressCount">0</div>
</div>

<div class="stat">
<div class="stat-title">مكتملة</div>
<div class="stat-number" id="completedCount">0</div>
</div>

<div class="stat">
<div class="stat-title">ملغاة</div>
<div class="stat-number" id="cancelledCount">0</div>
</div>

</div>


<div class="filters">

<div class="filters-grid">

<input
type="search"
id="searchInput"
class="filter"
placeholder="بحث برقم الطلب أو الاسم أو الهاتف..."
>

<select id="serviceFilter" class="filter">
<option value="">كل الخدمات</option>
<option value="تكييف وتبريد">تكييف وتبريد</option>
<option value="كهرباء">كهرباء</option>
<option value="سباكة">سباكة</option>
<option value="صيانة أجهزة منزلية">صيانة أجهزة منزلية</option>
<option value="نجارة">نجارة</option>
<option value="دهان">دهان</option>
<option value="أخرى">أخرى</option>
</select>

<select id="statusFilter" class="filter">
<option value="">كل الحالات</option>
<option value="جديد">جديد</option>
<option value="قيد المراجعة">قيد المراجعة</option>
<option value="تم تعيين فني">تم تعيين فني</option>
<option value="الفني في الطريق">الفني في الطريق</option>
<option value="قيد التنفيذ">قيد التنفيذ</option>
<option value="بانتظار قطعة/موافقة">بانتظار قطعة/موافقة</option>
<option value="مكتمل">مكتمل</option>
<option value="ملغي">ملغي</option>
</select>

<select id="priorityFilter" class="filter">
<option value="">كل الأولويات</option>
<option value="عادي">عادي</option>
<option value="متوسط">متوسط</option>
<option value="عاجل">عاجل</option>
</select>

<button class="refresh-btn" id="refreshBtn">
تحديث
</button>

</div>
</div>


<div class="requests-title">

<h3>طلبات العملاء</h3>

<span class="request-count" id="requestCount">
0 طلب
</span>

</div>


<div id="requestsContainer">
<div class="loading">
جاري تحميل الطلبات...
</div>
</div>

</main>


<div id="toast" class="toast"></div>


<script>

/* ======================================
SUPABASE
====================================== */

const SUPABASE_URL =
"https://yesmnsztcqnhaqrcgpcs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ======================================
DATA
====================================== */

let allRequests = [];
let technicians = [];


/* ======================================
ELEMENTS
====================================== */

const requestsContainer =
document.getElementById("requestsContainer");

const searchInput =
document.getElementById("searchInput");

const serviceFilter =
document.getElementById("serviceFilter");

const statusFilter =
document.getElementById("statusFilter");

const priorityFilter =
document.getElementById("priorityFilter");

const refreshBtn =
document.getElementById("refreshBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const toast =
document.getElementById("toast");


/* ======================================
START
====================================== */

document.addEventListener(
"DOMContentLoaded",
checkSession
);


async function checkSession(){

const {
data,
error
} = await client.auth.getSession();

if(error || !data.session){

window.location.href =
"admin.html";

return;
}

document.getElementById(
"adminEmail"
).textContent =
data.session.user.email ||
"حساب الإدارة";

await Promise.all([
loadTechnicians(),
loadRequests()
]);

}


/* ======================================
LOAD TECHNICIANS
====================================== */

async function loadTechnicians(){

const {
data,
error
} = await client
.from("technicians")
.select("id,full_name,phone,service_type,status")
.order(
"full_name",
{
ascending:true
}
);

if(error){

console.error(
"Technicians:",
error
);

technicians = [];

return;
}

technicians =
data || [];

}


/* ======================================
LOAD REQUESTS
====================================== */

async function loadRequests(){

requestsContainer.innerHTML = `
<div class="loading">
جاري تحميل الطلبات...
</div>
`;

const {
data,
error
} = await client
.from("service_requests")
.select("*")
.order(
"created_at",
{
ascending:false
}
);

if(error){

requestsContainer.innerHTML = `
<div class="empty">
<h3>تعذر تحميل الطلبات</h3>
<p style="margin-top:10px">
${escapeHtml(error.message)}
</p>
</div>
`;

return;
}

allRequests =
data || [];

updateStatistics();
renderRequests();

}


/* ======================================
STATISTICS
====================================== */

function updateStatistics(){

document.getElementById(
"totalCount"
).textContent =
allRequests.length;

document.getElementById(
"newCount"
).textContent =
allRequests.filter(
r => r.status === "جديد"
).length;

document.getElementById(
"progressCount"
).textContent =
allRequests.filter(
r =>
r.status === "قيد التنفيذ" ||
r.status === "الفني في الطريق" ||
r.status === "تم تعيين فني" ||
r.status === "قيد المراجعة"
).length;

document.getElementById(
"completedCount"
).textContent =
allRequests.filter(
r => r.status === "مكتمل"
).length;

document.getElementById(
"cancelledCount"
).textContent =
allRequests.filter(
r => r.status === "ملغي"
).length;

}


/* ======================================
FILTERS
====================================== */

searchInput.addEventListener(
"input",
renderRequests
);

serviceFilter.addEventListener(
"change",
renderRequests
);

statusFilter.addEventListener(
"change",
renderRequests
);

priorityFilter.addEventListener(
"change",
renderRequests
);

refreshBtn.addEventListener(
"click",
async function(){

await loadTechnicians();
await loadRequests();

showToast(
"تم تحديث البيانات"
);

}
);


/* ======================================
FILTER DATA
====================================== */

function getFilteredRequests(){

const search =
searchInput.value
.trim()
.toLowerCase();

const service =
serviceFilter.value;

const status =
statusFilter.value;

const priority =
priorityFilter.value;


return allRequests.filter(
request => {

const searchable = [

request.request_number,
request.customer_name,
request.phone,
request.location,
request.service_type

]
.filter(Boolean)
.join(" ")
.toLowerCase();


return (
(!search ||
searchable.includes(search)) &&

(!service ||
request.service_type === service) &&

(!status ||
request.status === status) &&

(!priority ||
request.priority === priority)
);

}
);

}


/* ======================================
RENDER
====================================== */

function renderRequests(){

const requests =
getFilteredRequests();

document.getElementById(
"requestCount"
).textContent =
requests.length + " طلب";


if(!requests.length){

requestsContainer.innerHTML = `
<div class="empty">
لا توجد طلبات مطابقة.
</div>
`;

return;
}


requestsContainer.innerHTML = `
<div class="requests">
${requests.map(
requestCard
).join("")}
</div>
`;

}


/* ======================================
REQUEST CARD
====================================== */

function requestCard(request){

const preferred =
request.preferred_date
? formatDate(request.preferred_date)
: "غير محدد";


return `

<article
class="request-card"
data-id="${escapeHtml(request.id)}"
>

<div class="request-top">

<div>

<div class="request-number">
${escapeHtml(
request.request_number ||
"بدون رقم"
)}
</div>

<div class="request-date">
${formatDate(request.created_at)}
</div>

</div>

<div class="badges">

<span class="badge ${getStatusClass(request.status)}">
${escapeHtml(
request.status ||
"غير محدد"
)}
</span>

<span class="badge">
${escapeHtml(
request.priority ||
"عادي"
)}
</span>

</div>

</div>


<div class="request-info">

<div class="info-box">
<div class="info-label">العميل</div>
<div class="info-value">
${escapeHtml(
request.customer_name || "-"
)}
</div>
</div>

<div class="info-box">
<div class="info-label">الهاتف</div>
<div class="info-value">
${escapeHtml(
request.phone || "-"
)}
</div>
</div>

<div class="info-box">
<div class="info-label">الخدمة</div>
<div class="info-value">
${escapeHtml(
request.service_type || "-"
)}
</div>
</div>

<div class="info-box">
<div class="info-label">الموعد</div>
<div class="info-value">
${preferred}
</div>
</div>

<div class="info-box">
<div class="info-label">الموقع</div>
<div class="info-value">
${escapeHtml(
request.location || "-"
)}
</div>
</div>

<div class="info-box">
<div class="info-label">الفني الحالي</div>
<div class="info-value">
${escapeHtml(
request.assigned_technician_name ||
"لم يتم تعيين فني"
)}
</div>
</div>

</div>


<div class="description">

<strong>وصف المشكلة:</strong>

<br>

${escapeHtml(
request.description ||
"لا يوجد وصف"
)}

</div>


${
request.image_url
?
`
<div style="margin-bottom:16px">
<a
href="${escapeHtml(request.image_url)}"
target="_blank"
rel="noopener noreferrer"
class="image-link"
>
عرض صورة العطل
</a>
</div>
`
:
""
}


<div class="controls">


<div class="control">

<label>حالة الطلب</label>

<select class="request-status">

${statusOptions(
request.status
)}

</select>

</div>


<div class="control">

<label>الأولوية</label>

<select class="request-priority">

${priorityOptions(
request.priority
)}

</select>

</div>


<div class="control">

<label>تعيين الفني</label>

<select class="technician-select">

${technicianOptions(
request.assigned_technician_id,
request.service_type
)}

</select>

</div>


<div class="control">

<label>ملاحظات الإدارة</label>

<textarea
class="admin-notes"
placeholder="ملاحظات الإدارة..."
>${escapeHtml(
request.admin_notes || ""
)}</textarea>

</div>


<div class="control">

<label>ملاحظات الفني</label>

<textarea
class="technician-notes"
placeholder="ملاحظات الفني..."
>${escapeHtml(
request.technician_notes || ""
)}</textarea>

</div>


<div class="control">

<label>تاريخ الإنجاز</label>

<input
type="text"
value="${
request.completed_at
?
formatDate(request.completed_at)
:
"لم يكتمل بعد"
}"
disabled
>

</div>


</div>


<div class="save-row">

<span style="color:#64748b;font-size:11px">
${
request.updated_at
?
"آخر تحديث: " +
formatDate(request.updated_at)
:
"لم يتم التحديث"
}
</span>

<button
class="save-btn"
onclick="saveRequest('${escapeAttribute(request.id)}',this)"
>
حفظ التعديلات
</button>

</div>

</article>

`;

}


/* ======================================
TECHNICIAN OPTIONS
====================================== */

function technicianOptions(
selectedId,
service
){

let html = `
<option value="">
-- بدون فني --
</option>
`;


const matching =
technicians.filter(
technician => {

if(!service){
return true;
}

return (
technician.service_type === service ||
technician.service_type === "متعدد التخصصات" ||
technician.status === "متاح"
);

}
);


matching.forEach(
technician => {

html += `
<option
value="${escapeAttribute(technician.id)}"
${technician.id === selectedId ? "selected" : ""}
>
${escapeHtml(
technician.full_name
)}
${
technician.service_type
?
" — " +
escapeHtml(
technician.service_type
)
:
""
}
</option>
`;

});


return html;

}


/* ======================================
STATUS OPTIONS
====================================== */

function statusOptions(current){

const options = [
"جديد",
"قيد المراجعة",
"تم تعيين فني",
"الفني في الطريق",
"قيد التنفيذ",
"بانتظار قطعة/موافقة",
"مكتمل",
"ملغي"
];

return options.map(
option => `
<option
value="${escapeAttribute(option)}"
${current === option ? "selected" : ""}
>
${escapeHtml(option)}
</option>
`
).join("");

}


/* ======================================
PRIORITY OPTIONS
====================================== */

function priorityOptions(current){

const options = [
"عادي",
"متوسط",
"عاجل"
];

return options.map(
option => `
<option
value="${escapeAttribute(option)}"
${(current || "عادي") === option ? "selected" : ""}
>
${escapeHtml(option)}
</option>
`
).join("");

}


/* ======================================
SAVE
====================================== */

window.saveRequest =
async function(id,button){

const card =
document.querySelector(
`.request-card[data-id="${CSS.escape(id)}"]`
);

if(!card){
return;
}


const status =
card.querySelector(
".request-status"
).value;

const priority =
card.querySelector(
".request-priority"
).value;

const technicianId =
card.querySelector(
".technician-select"
).value;

const adminNotes =
card.querySelector(
".admin-notes"
).value.trim();

const technicianNotes =
card.querySelector(
".technician-notes"
).value.trim();


let technicianName = null;


if(technicianId){

const technician =
technicians.find(
item =>
item.id === technicianId
);

if(technician){

technicianName =
technician.full_name;

}

}


button.disabled = true;
button.textContent =
"جاري الحفظ...";


const updateData = {

status,
priority,

assigned_technician_id:
technicianId || null,

technicianName,

technician_notes:

};

);

} = await client

/* ======================================
HELPERS
====================================== */

function formatDate(value){

if(!value){
return "-";
}

const date =
new Date(value);

if(
Number.isNaN(
date.getTime()
)
){
return String(value);
}

return date.toLocaleString(
"ar-JO",
{
year:"numeric",
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}


function getStatusClass(status){

if(status === "جديد"){
return "new";
}

if(status === "مكتمل"){
return "done";
}

if(status === "ملغي"){
return "cancelled";
}

return "progress";

}


function escapeHtml(value){

if(
value === null ||
value === undefined
){
return "";
}

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return escapeHtml(value);

}


function showToast(
message,
error=false
){

toast.textContent =
message;

toast.className =
error
?
"toast error"
:
"toast";

toast.style.display =
"block";

clearTimeout(
window.toastTimer
);

window.toastTimer =
setTimeout(
()=>{
toast.style.display =
"none";
},
3500
);

}
