<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة فني برو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#07111f;
  color:#fff;
  min-height:100vh;
}

header{
  background:linear-gradient(135deg,#111d35,#182b50);
  padding:18px;
  border-bottom:1px solid #263957;
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#5da9ff;
}

.header-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button,
.btn{
  border:none;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  text-decoration:none;
  display:inline-block;
}

.btn-primary{
  background:#287cff;
  color:#fff;
}

.btn-success{
  background:#16a765;
  color:#fff;
}

.btn-danger{
  background:#d9363e;
  color:#fff;
}

.btn-warning{
  background:#d99a00;
  color:#fff;
}

.btn-dark{
  background:#24344f;
  color:#fff;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.access-denied{
  max-width:600px;
  margin:80px auto;
  background:#111d31;
  border:1px solid #293b5c;
  border-radius:16px;
  padding:30px;
  text-align:center;
}

.access-denied h2{
  color:#ff6262;
  margin-bottom:15px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#9db1cf;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:#111d31;
  border:1px solid #293b5c;
  border-radius:14px;
  padding:20px;
}

.stat-title{
  color:#91a5c2;
  font-size:14px;
  margin-bottom:10px;
}

.stat-number{
  font-size:30px;
  font-weight:bold;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
  padding-bottom:4px;
}

.tab{
  background:#15233b;
  color:#b9c8df;
  white-space:nowrap;
}

.tab.active{
  background:#287cff;
  color:#fff;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.panel{
  background:#101c2e;
  border:1px solid #293b5c;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

.panel h2{
  margin-bottom:18px;
  font-size:20px;
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

input,
select,
textarea{
  width:100%;
  background:#0a1526;
  color:#fff;
  border:1px solid #314664;
  border-radius:8px;
  padding:11px;
  font-size:14px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#287cff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.requests-grid,
.technicians-grid,
.applications-grid,
.ratings-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  background:#0c1829;
  border:1px solid #293b5c;
  border-radius:14px;
  padding:17px;
}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.card-title{
  font-weight:bold;
  font-size:17px;
}

.card-row{
  display:flex;
  gap:8px;
  margin:8px 0;
  color:#c4d0e3;
  line-height:1.6;
}

.card-row strong{
  color:#fff;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.badge-new{
  background:#193b70;
  color:#74b4ff;
}

.badge-progress{
  background:#4d3b0d;
  color:#ffd45c;
}

.badge-success{
  background:#0d482f;
  color:#55dfa2;
}

.badge-danger{
  background:#4d1820;
  color:#ff747d;
}

.badge-info{
  background:#28224c;
  color:#b49cff;
}

.card-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  color:#aebed4;
  font-size:13px;
}

.empty{
  text-align:center;
  padding:35px;
  color:#879ab6;
  background:#0b1728;
  border-radius:12px;
  border:1px dashed #304563;
  grid-column:1/-1;
}

.application-card{
  position:relative;
}

.application-card.accepted{
  border-color:#16a765;
}

.application-card.rejected{
  border-color:#d9363e;
}

.application-status-select{
  margin-bottom:10px;
}

.application-admin-notes{
  min-height:100px;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  max-width:360px;
  background:#15243a;
  border:1px solid #385173;
  color:#fff;
  padding:14px 17px;
  border-radius:10px;
  box-shadow:0 10px 30px #0008;
  z-index:9999;
  display:none;
}

.toast.show{
  display:block;
}

.toast.error{
  border-color:#d9363e;
}

.toast.success{
  border-color:#16a765;
}

.review-stars{
  color:#ffd34d;
  font-size:18px;
}

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .filters{
    grid-template-columns:repeat(2,1fr);
  }

  .requests-grid,
  .technicians-grid,
  .applications-grid,
  .ratings-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  header{
    padding:13px;
  }

  .header-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .container{
    padding:12px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .stat{
    padding:14px;
  }

  .stat-number{
    font-size:24px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .panel{
    padding:14px;
  }

  .card{
    padding:14px;
  }

  .card-actions button,
  .card-actions a{
    width:100%;
    text-align:center;
  }

}

</style>

</head>

<script>

const SUPABASE_URL =
"https://yesmnsztcqnhaqrcgpcs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let requests = [];
let technicians = [];
let technicianApplications = [];
let technicianRatings = [];


/* =========================
   أدوات
========================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showToast(message,error=false){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.className =
    "toast show " +
    (error ? "error" : "success");

  setTimeout(()=>{
    toast.className="toast";
  },4000);
}


function statusBadge(status){

  let cls="badge-info";

  if(
    status==="جديد" ||
    status==="قيد المراجعة"
  ){
    cls="badge-new";
  }

  if(
    status==="قيد التنفيذ" ||
    status==="الفني في الطريق" ||
    status==="تم تعيين فني" ||
    status==="بدأ العمل"
  ){
    cls="badge-progress";
  }

  if(status==="مكتمل"){
    cls="badge-success";
  }

  if(status==="ملغي"){
    cls="badge-danger";
  }

  return `
    <span class="badge ${cls}">
      ${escapeHtml(status || "غير محدد")}
    </span>
  `;
}


/* =========================
   التبويبات
========================= */

function openTab(id,button){

  document
    .querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });

  document
    .querySelectorAll(".tab")
    .forEach(tab=>{
      tab.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  button.classList.add("active");

}


/* =========================
   تسجيل الخروج
========================= */

async function logout(){

  await client.auth.signOut();

  window.location.href="login.html";

}


/* =========================
   التحقق من المدير
========================= */

async function checkAdmin(){

  try{

    const {
      data,
      error
    } = await client.auth.getSession();

    if(error){
      throw error;
    }

    const session =
      data?.session;

    if(!session){

      showAccessDenied(
        "يجب تسجيل الدخول أولاً."
      );

      return false;
    }


    const user =
      session.user;


    const {
      data:roleData,
      error:roleError
    } = await client
      .from("user_roles")
      .select("role")
      .eq("user_id",user.id)
      .maybeSingle();


    if(roleError){

      console.error(roleError);

      showAccessDenied(
        "حدث خطأ أثناء التحقق من صلاحيات الحساب."
      );

      return false;
    }


    if(
      !roleData ||
      roleData.role !== "admin"
    ){

      showAccessDenied(
        "هذا الحساب ليس لديه صلاحية مدير."
      );

      return false;
    }


    document
      .getElementById("loading")
      .style.display="none";

    document
      .getElementById("dashboard")
      .style.display="block";


    await loadAll();

    return true;

  }catch(error){

    console.error(error);

    showAccessDenied(
      "تعذر التحقق من الحساب."
    );

    return false;

  }

}


function showAccessDenied(message){

  document
    .getElementById("loading")
    .style.display="none";

  document
    .getElementById("accessDenied")
    .style.display="block";

  document
    .getElementById("accessDeniedMessage")
    .textContent=message;

}


/* =========================
   تحميل الكل
========================= */

async function loadAll(){

  await Promise.all([
    loadRequests(),
    loadTechnicians(),
    loadTechnicianApplications(),
    loadTechnicianRatings()
  ]);

  updateStats();

}


/* =========================
   الطلبات
========================= */

async function loadRequests(){

  const {
    data,
    error
  } = await client
    .from("service_requests")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );

  if(error){

    console.error(error);

    showToast(
      "تعذر تحميل طلبات الصيانة: "+
      error.message,
      true
    );

    return;
  }

  requests=data || [];

  renderRequests();

  updateStats();

}


function updateStats(){

  const total =
    requests.length;

  const newCount =
    requests.filter(
      r=>r.status==="جديد"
    ).length;

  const progress =
    requests.filter(
      r =>
        [
          "قيد المراجعة",
          "تم تعيين فني",
          "الفني في الطريق",
          "قيد التنفيذ",
          "بدأ العمل",
          "بانتظار قطعة/موافقة"
        ].includes(r.status)
    ).length;

  const completed =
    requests.filter(
      r=>r.status==="مكتمل"
    ).length;


  document
    .getElementById("totalRequests")
    .textContent=total;

  document
    .getElementById("newRequests")
    .textContent=newCount;

  document
    .getElementById("progressRequests")
    .textContent=progress;

  document
    .getElementById("completedRequests")
    .textContent=completed;

}


function renderRequests(){

  const grid =
    document.getElementById(
      "requestsGrid"
    );

  const service =
    document.getElementById(
      "serviceFilter"
    ).value;

  const status =
    document.getElementById(
      "statusFilter"
    ).value;

  const priority =
    document.getElementById(
      "priorityFilter"
    ).value;

  const search =
    document.getElementById(
      "requestSearch"
    ).value
      .trim()
      .toLowerCase();


  let filtered =
    requests.filter(request=>{

      if(
        service &&
        request.service_type !== service
      ){
        return false;
      }

      if(
        status &&
        request.status !== status
      ){
        return false;
      }

      if(
        priority &&
        request.priority !== priority
      ){
        return false;
      }


      if(search){

        const text = [
          request.request_number,
          request.customer_name,
          request.phone,
          request.service_type
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

        if(!text.includes(search)){
          return false;
        }

      }

      return true;

    });


  if(!filtered.length){

    grid.innerHTML=`
      <div class="empty">
        لا توجد طلبات مطابقة.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    filtered
      .map(requestCard)
      .join("");

}


function requestCard(request){

  const assignedTechnician =
    technicians.find(
      t =>
        String(t.id) ===
        String(request.technician_id)
    );


  return `

  <div class="card">

    <div class="card-header">

      <div class="card-title">
        ${escapeHtml(
          request.request_number ||
          "بدون رقم"
        )}
      </div>

      ${statusBadge(request.status)}

    </div>


    <div class="card-row">
      <strong>العميل:</strong>
      <span>
        ${escapeHtml(
          request.customer_name ||
          "غير متوفر"
        )}
      </span>
    </div>


    <div class="card-row">
      <strong>الهاتف:</strong>
      <span>
        ${escapeHtml(
          request.phone ||
          "غير متوفر"
        )}
      </span>
    </div>


    <div class="card-row">
      <strong>الخدمة:</strong>
      <span>
        ${escapeHtml(
          request.service_type ||
          "غير محدد"
        )}
      </span>
    </div>


    <div class="card-row">
      <strong>الموعد:</strong>
      <span>
        ${escapeHtml(
          request.preferred_date ||
          "غير محدد"
        )}
      </span>
    </div>


    <div class="card-row">
      <strong>الموقع:</strong>
      <span>
        ${escapeHtml(
          request.location ||
          "غير محدد"
        )}
      </span>
    </div>


    <div class="card-row">
      <strong>الأولوية:</strong>
      <span>
        ${escapeHtml(
          request.priority ||
          "عادي"
        )}
      </span>
    </div>


    <div class="card-row">

      <strong>الفني:</strong>

      <span>

        ${
          assignedTechnician
          ? escapeHtml(
              assignedTechnician.full_name
            )
          : "لم يتم التعيين"
        }

      </span>

    </div>


    ${
      request.description
      ? `
        <div class="card-row">
          <strong>الوصف:</strong>
          <span>
            ${escapeHtml(
              request.description
            )}
          </span>
        </div>
      `
      : ""
    }


    <div class="card-actions">

      <select
        onchange="changeRequestStatus(
          '${request.id}',
          this.value
        )">

        ${requestStatusOptions(
          request.status
        )}

      </select>


      <select
        onchange="assignTechnician(
          '${request.id}',
          this.value
        )">

        <option value="">
          اختيار فني
        </option>

        ${technicians
          .filter(
            t =>
              t.status !== "موقوف"
          )
          .map(t=>`

            <option
              value="${escapeHtml(t.id)}"
              ${
                String(
                  request.technician_id
                ) === String(t.id)
                ? "selected"
                : ""
              }>

              ${escapeHtml(
                t.full_name ||
                t.phone ||
                "فني"
              )}

            </option>

          `)
          .join("")}

      </select>


      ${
        request.status==="ملغي"
        ? `
          <button
            class="btn btn-danger"
            onclick="deleteCancelledRequest(
              '${request.id}'
            )">

            حذف

          </button>
        `
        : ""
      }

    </div>

  </div>

  `;

}


function requestStatusOptions(current){

  const statuses=[
    "جديد",
    "قيد المراجعة",
    "تم تعيين فني",
    "الفني في الطريق",
    "قيد التنفيذ",
    "بدأ العمل",
    "بانتظار قطعة/موافقة",
    "مكتمل",
    "ملغي"
  ];

  return statuses
    .map(status=>`

      <option
        value="${escapeHtml(status)}"
        ${
          current===status
          ? "selected"
          : ""
        }>

        ${escapeHtml(status)}

      </option>

    `)
    .join("");

}


/* =========================
   تغيير حالة الطلب
========================= */

async function changeRequestStatus(
  requestId,
  status
){

  try{

    const updateData={
      status:status,
      updated_at:
        new Date().toISOString()
    };


    if(status==="مكتمل"){

      updateData.completed_at =
        new Date().toISOString();

    }


    const {
      error
    } = await client
      .from("service_requests")
      .update(updateData)
      .eq("id",requestId);


    if(error){
      throw error;
    }


    const request =
      requests.find(
        r =>
          String(r.id) ===
          String(requestId)
      );


    if(
      request &&
      request.technician_id
    ){

      let technicianStatus =
        "مشغول";

      if(
        status==="مكتمل" ||
        status==="ملغي"
      ){
        technicianStatus="متاح";
      }


      await client
        .from("technicians")
        .update({
          status:technicianStatus
        })
        .eq(
          "id",
          request.technician_id
        );

    }


    showToast(
      "تم تحديث حالة الطلب."
    );

    await loadRequests();
    await loadTechnicians();

  }catch(error){

    console.error(error);

    showToast(
      "فشل تحديث الطلب: "+
      error.message,
      true
    );

  }

}


/* =========================
   تعيين فني
========================= */

async function assignTechnician(
  requestId,
  technicianId
){

  try{

    const oldRequest =
      requests.find(
        r =>
          String(r.id) ===
          String(requestId)
      );


    const {
      error
    } = await client
      .from("service_requests")
      .update({
        technician_id:
          technicianId || null,

        status:
          technicianId
          ? "تم تعيين فني"
          : "جديد",

        updated_at:
          new Date().toISOString()
      })
      .eq("id",requestId);


    if(error){
      throw error;
    }


    if(
      technicianId
    ){

      await client
        .from("technicians")
        .update({
          status:"مشغول"
        })
        .eq(
          "id",
          technicianId
        );

    }


    if(
      oldRequest?.technician_id &&
      String(
        oldRequest.technician_id
      ) !== String(technicianId)
    ){

      await client
        .from("technicians")
        .update({
          status:"متاح"
        })
        .eq(
          "id",
          oldRequest.technician_id
        );

    }


    showToast(
      technicianId
      ? "تم تعيين الفني."
      : "تم إلغاء تعيين الفني."
    );


    await loadRequests();
    await loadTechnicians();

  }catch(error){

    console.error(error);

    showToast(
      "فشل تعيين الفني: "+
      error.message,
      true
    );

  }

}

/* =========================
   قبول / حفظ الفني
========================= */

window.saveTechnicianApplication =
async function(id,button){

  try{

    const card =
      document.querySelector(
        `.application-card[data-application-id="${CSS.escape(id)}"]`
      );


    if(!card){
      return;
    }


    const status =
      card.querySelector(
        ".application-status-select"
      ).value;


    const adminNotes =
      card.querySelector(
        ".application-admin-notes"
      ).value.trim();


    button.disabled=true;
    button.textContent=
      "جاري الحفظ...";


    const {
      data:userData,
      error:userError
    } = await client.auth.getUser();


    if(userError){
      throw userError;
    }


    const adminUserId =
      userData?.user?.id ||
      null;


    /*
      تحديث طلب الفني
    */

    const updateData={

      status:status,

      admin_notes:
        adminNotes || null,

      reviewed_by:
        adminUserId,

      reviewed_at:
        new Date().toISOString(),

      updated_at:
        new Date().toISOString()

    };


    const {
      error
    } = await client
      .from("technician_applications")
      .update(updateData)
      .eq("id",id);


    if(error){
      throw error;
    }


    /*
      إذا تم قبول الفني
    */

    if(status==="مقبول"){

      const application =
        technicianApplications.find(
          item =>
            String(item.id) ===
            String(id)
        );


      if(!application){
        throw new Error(
          "لم يتم العثور على بيانات طلب الفني."
        );
      }


      const technicianUserId =
        application.user_id ||
        null;


      /*
        لا يوجد user_id
      */

      if(!technicianUserId){

        showToast(
          "تم حفظ القبول، لكن الفني غير مرتبط بحساب مستخدم. أضف user_id إلى طلب الفني لتمكينه من دخول لوحة الفني.",
          true
        );


        await loadTechnicianApplications();


        button.disabled=false;
        button.textContent="حفظ";


        return;
      }


      /*
        إضافة صلاحية technician
      */

      const {
        error:roleError
      } = await client
        .from("user_roles")
        .upsert(

          {
            user_id:
              technicianUserId,

            role:
              "technician"
          },

          {
            onConflict:
              "user_id"
          }

        );


      if(roleError){
        throw roleError;
      }


      /*
        إنشاء سجل الفني
      */

      const technicianData={

        id:
          technicianUserId,

        full_name:
          application.full_name ||
          null,

        phone:
          application.phone ||
          null,

        service_type:
          application.service_type ||
          null,

        status:
          "متاح"

      };


      const {
        error:technicianError
      } = await client
        .from("technicians")
        .upsert(
          technicianData,
          {
            onConflict:"id"
          }
        );


      if(technicianError){
        throw technicianError;
      }


      showToast(
        "تم قبول الفني وتفعيل حسابه بنجاح."
      );

    }else{

      showToast(
        "تم تحديث طلب الفني."
      );

    }


    await loadTechnicians();
    await loadTechnicianApplications();
    await loadRequests();
    await loadTechnicianRatings();


  }catch(error){

    console.error(
      "Save technician application error:",
      error
    );


    showToast(
      "فشل الحفظ: "+
      (
        error.message ||
        "خطأ غير معروف"
      ),
      true
    );


    button.disabled=false;
    button.textContent="حفظ";

  }

};

   التقييمات
========================= */

async function loadTechnicianRatings(){

  const {
    data,
    error
  } = await client
    .from("technician_reviews")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.error(error);

    technicianRatings=[];

    renderTechnicianRatings();

    return;
  }


  technicianRatings =
    data || [];

  renderTechnicianRatings();

}


function renderTechnicianRatings(){

  const grid =
    document.getElementById(
      "ratingsGrid"
    );


  if(!technicianRatings.length){

    grid.innerHTML=`
      <div class="empty">
        لا توجد تقييمات حاليًا.
      </div>
    `;

    return;
  }


  grid.innerHTML =
    technicianRatings
      .map(review=>{

        const stars =
          Math.max(
            0,
            Math.min(
              5,
              Number(review.rating) || 0
            )
          );


        return `

        <div class="card">

          <div class="card-header">

            <div class="card-title">
              تقييم فني
            </div>

            <div class="review-stars">
              ${"★".repeat(stars)}
              ${"☆".repeat(5-stars)}
            </div>

          </div>


          <div class="card-row">
            <strong>التقييم:</strong>
            <span>
              ${stars}/5
            </span>
          </div>


          ${
            review.comment
            ? `
              <div class="card-row">
                <strong>التعليق:</strong>
                <span>
                  ${escapeHtml(
                    review.comment
                  )}
                </span>
              </div>
            `
            : ""
          }

        </div>

        `;

      })
      .join("");

}


/* =========================
   حذف طلب ملغي
========================= */

async function deleteCancelledRequest(
  requestId
){

  const confirmed =
    confirm(
      "هل أنت متأكد من حذف طلب الصيانة الملغي؟"
    );


  if(!confirmed){
    return;
  }


  try{

    const {
      error
    } = await client
      .from("service_requests")
      .delete()
      .eq("id",requestId);


    if(error){
      throw error;
    }


    showToast(
      "تم حذف الطلب."
    );


    await loadRequests();

  }catch(error){

    console.error(error);

    showToast(
      "فشل حذف الطلب: "+
      error.message,
      true
    );

  }

}
