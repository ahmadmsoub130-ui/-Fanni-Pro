<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تتبع طلب الصيانة | فني برو</title>

  <meta name="description" content="تتبع حالة طلب الصيانة ومراجعة عرض السعر والموافقة عليه عبر فني برو">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(135deg, #07111f, #101b35);
      color: #fff;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background: rgba(8, 18, 35, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #60a5fa;
      font-size: 24px;
      font-weight: bold;
    }

    .back-btn {
      text-decoration: none;
      color: white;
      background: #2563eb;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .hero {
      text-align: center;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #b8c4d9;
      line-height: 1.8;
    }

    .search-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 22px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    }

    .search-box label {
      display: block;
      margin-bottom: 8px;
      color: #dbeafe;
      font-weight: bold;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-row input {
      flex: 1;
    }

    input,
    textarea {
      width: 100%;
      border: none;
      outline: none;
      background: #f8fafc;
      color: #111827;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
    }

    .search-btn {
      background: #2563eb;
      color: white;
      padding: 0 22px;
      border-radius: 10px;
      font-weight: bold;
    }

    .search-btn:hover {
      background: #1d4ed8;
    }

    #message {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.7;
    }

    .message-success {
      display: block !important;
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      color: #6ee7b7;
    }

    .message-error {
      display: block !important;
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
    }

    .message-info {
      display: block !important;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.4);
      color: #93c5fd;
    }

    #requestResult {
      display: none;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.18);
    }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .request-number {
      font-size: 22px;
      font-weight: bold;
      color: #60a5fa;
    }

    .status {
      display: inline-block;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .status-new {
      background: rgba(59,130,246,0.18);
      color: #93c5fd;
    }

    .status-review {
      background: rgba(245,158,11,0.18);
      color: #fcd34d;
    }

    .status-assigned {
      background: rgba(139,92,246,0.18);
      color: #c4b5fd;
    }

    .status-road {
      background: rgba(6,182,212,0.18);
      color: #67e8f9;
    }

    .status-working {
      background: rgba(249,115,22,0.18);
      color: #fdba74;
    }

    .status-waiting {
      background: rgba(234,179,8,0.18);
      color: #fde047;
    }

    .status-completed {
      background: rgba(16,185,129,0.18);
      color: #6ee7b7;
    }

    .status-cancelled {
      background: rgba(239,68,68,0.18);
      color: #fca5a5;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info-item {
      background: rgba(255,255,255,0.04);
      padding: 14px;
      border-radius: 12px;
    }

    .info-label {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .info-value {
      color: #fff;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }

    .description {
      margin-top: 15px;
      background: rgba(255,255,255,0.04);
      padding: 15px;
      border-radius: 12px;
      line-height: 1.8;
    }

    .description-title {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 6px;
    }

    /* السعر */

    .price-card {
      margin-top: 20px;
      background: linear-gradient(
        135deg,
        rgba(37,99,235,0.15),
        rgba(124,58,237,0.15)
      );
      border: 1px solid rgba(96,165,250,0.35);
      border-radius: 18px;
      padding: 20px;
    }

    .price-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #bfdbfe;
    }

    .price-subtitle {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .price-amount {
      text-align: center;
      background: rgba(0,0,0,0.2);
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .price-amount .number {
      display: block;
      font-size: 36px;
      font-weight: bold;
      color: #fbbf24;
    }

    .price-amount .currency {
      color: #cbd5e1;
      font-size: 14px;
    }

    .price-notes {
      background: rgba(255,255,255,0.05);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
      line-height: 1.8;
    }

    .price-notes strong {
      color: #93c5fd;
      display: block;
      margin-bottom: 5px;
    }

    .price-date {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .approval-pending {
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.3);
      color: #fcd34d;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .approval-approved {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.35);
      color: #6ee7b7;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      line-height: 1.8;
      font-weight: bold;
    }

    .approval-rejected {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 15px;
      line-height: 1.8;
      font-weight: bold;
    }

    .approval-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .approve-btn,
    .reject-btn {
      padding: 14px;
      border-radius: 11px;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .approve-btn {
      background: #059669;
    }

    .approve-btn:hover {
      background: #047857;
    }

    .reject-btn {
      background: #dc2626;
    }

    .reject-btn:hover {
      background: #b91c1c;
    }

    .approve-btn:disabled,
    .reject-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .technician-card {
      margin-top: 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 15px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .technician-title {
      color: #93c5fd;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .technician-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .timeline {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .timeline-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .timeline-item {
      position: relative;
      padding: 10px 35px 10px 0;
      color: #94a3b8;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      right: 5px;
      top: 15px;
      width: 12px;
      height: 12px;
      background: #475569;
      border-radius: 50%;
    }

    .timeline-item.active {
      color: #fff;
      font-weight: bold;
    }

    .timeline-item.active::before {
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34,197,94,0.5);
    }

    .timeline-item.done {
      color: #86efac;
    }

    .timeline-item.done::before {
      background: #22c55e;
    }

    .last-update {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 18px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #94a3b8;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    .refresh-btn {
      display: block;
      margin: 15px auto 0;
      background: rgba(255,255,255,0.08);
      color: #cbd5e1;
      padding: 10px 18px;
      border-radius: 10px;
    }

    .refresh-btn:hover {
      background: rgba(255,255,255,0.13);
    }

    @media (max-width: 650px) {

      .hero h1 {
        font-size: 25px;
      }

      .search-row {
        flex-direction: column;
      }

      .search-btn {
        padding: 14px;
      }

      .info-grid,
      .technician-info {
        grid-template-columns: 1fr;
      }

      .approval-buttons {
        grid-template-columns: 1fr;
      }

      .request-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .request-number {
        font-size: 19px;
      }

      .price-amount .number {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">فني برو</div>

    <a href="index.html" class="back-btn">
      الرئيسية
    </a>
  </div>
</header>

<main>

  <section class="hero">
    <h1>تتبع طلب الصيانة</h1>
    <p>
      أدخل رقم طلبك لمعرفة حالة الطلب ومراجعة عرض السعر والموافقة عليه.
    </p>
  </section>

  <section class="search-box">

    <label for="requestNumber">
      رقم الطلب
    </label>

    <div class="search-row">

      <input
        type="text"
        id="requestNumber"
        placeholder="مثال: FP-123456"
        autocomplete="off"
      >

      <button
        class="search-btn"
        onclick="trackRequest()"
      >
        تتبع الطلب
      </button>

    </div>

  </section>

  <div id="message"></div>

  <div id="requestResult"></div>

</main>

<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://yesmnsztcqnhaqrcgpcs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     VARIABLES
  ================================= */

  let currentRequest = null;
  let refreshTimer = null;


  /* ================================
     MESSAGE
  ================================= */

  function showMessage(text, type = "info") {

    const message =
      document.getElementById("message");

    message.className = "";

    message.textContent = text;

    if (type === "success") {
      message.classList.add("message-success");
    }

    else if (type === "error") {
      message.classList.add("message-error");
    }

    else {
      message.classList.add("message-info");
    }
  }


  function hideMessage() {

    const message =
      document.getElementById("message");

    message.style.display = "none";
    message.className = "";

  }


  /* ================================
     ESCAPE HTML
  ================================= */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ================================
     FORMAT DATE
  ================================= */

  function formatDate(date) {

    if (!date) {
      return "غير محدد";
    }

    try {

      return new Date(date).toLocaleString(
        "ar-JO",
        {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    } catch (error) {

      return date;

    }
  }


  /* ================================
     STATUS CLASS
  ================================= */

  function getStatusClass(status) {

    switch (status) {

      case "جديد":
        return "status-new";

      case "قيد المراجعة":
        return "status-review";

      case "تم تعيين فني":
        return "status-assigned";

      case "الفني في الطريق":
        return "status-road";

      case "قيد التنفيذ":
      case "بدأ العمل":
        return "status-working";

      case "بانتظار قطعة/موافقة":
        return "status-waiting";

      case "مكتمل":
        return "status-completed";

      case "ملغي":
        return "status-cancelled";

      default:
        return "status-review";
    }
  }


  /* ================================
     TRACK REQUEST
  ================================= */

  async function trackRequest(
    silent = false
  ) {

    const input =
      document.getElementById("requestNumber");

    let requestNumber =
      input.value.trim();

    if (!requestNumber) {

      showMessage(
        "يرجى إدخال رقم الطلب.",
        "error"
      );

      return;
    }

    requestNumber =
      requestNumber.toUpperCase();

    input.value = requestNumber;

    if (!silent) {

      showMessage(
        "جاري البحث عن الطلب...",
        "info"
      );

    }

    const result =
      document.getElementById("requestResult");

    if (!silent) {
      result.innerHTML =
        '<div class="card loading">جاري تحميل الطلب...</div>';
    }

    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("service_requests")
        .select(`
          id,
          request_number,
          customer_name,
          phone,
          service_type,
          preferred_date,
          location,
          description,
          status,
          priority,
          technician_id,
          admin_notes,
          technician_notes,
          estimated_cost,
          customer_approval,
          price_notes,
          price_updated_at,
          completed_at,
          created_at,
          updated_at
        `)
        .eq(
          "request_number",
          requestNumber
        )
        .maybeSingle();


      if (error) {
        console.error(error);

        throw error;
      }


      if (!data) {

        currentRequest = null;

        result.innerHTML = "";

        showMessage(
          "لم يتم العثور على طلب بهذا الرقم. تأكد من كتابة رقم الطلب بشكل صحيح.",
          "error"
        );

        stopAutoRefresh();

        return;
      }


      currentRequest = data;

      hideMessage();

      await renderRequest(data);

      startAutoRefresh();

    } catch (error) {

      console.error(
        "Track request error:",
        error
      );

      showMessage(
        "حدث خطأ أثناء جلب الطلب. تأكد من اتصال الإنترنت وحاول مرة أخرى.",
        "error"
      );

    }
  }


  /* ================================
     RENDER REQUEST
  ================================= */

  async function renderRequest(request) {

    const result =
      document.getElementById("requestResult");

    let technicianHTML = "";

    if (request.technician_id) {

      technicianHTML =
        await getTechnicianHTML(
          request.technician_id
        );

    }


    const priceHTML =
      createPriceHTML(request);


    const timelineHTML =
      createTimeline(request.status);


    result.style.display = "block";

    result.innerHTML = `

      <div class="card">

        <div class="request-header">

          <div class="request-number">
            ${escapeHTML(request.request_number)}
          </div>

          <div class="status ${getStatusClass(request.status)}">
            ${escapeHTML(request.status || "غير محدد")}
          </div>

        </div>


        <div class="info-grid">

          <div class="info-item">
            <div class="info-label">
              اسم العميل
            </div>

            <div class="info-value">
              ${escapeHTML(request.customer_name)}
            </div>
          </div>


          <div class="info-item">
            <div class="info-label">
              نوع الخدمة
            </div>

            <div class="info-value">
              ${escapeHTML(request.service_type)}
            </div>
          </div>


          <div class="info-item">
            <div class="info-label">
              رقم الهاتف
            </div>

            <div class="info-value">
              ${escapeHTML(request.phone)}
            </div>
          </div>


          <div class="info-item">
            <div class="info-label">
              الأولوية
            </div>

            <div class="info-value">
              ${escapeHTML(request.priority || "عادي")}
            </div>
          </div>


          <div class="info-item">
            <div class="info-label">
              الموعد المفضل
            </div>

            <div class="info-value">
              ${escapeHTML(request.preferred_date || "لم يتم تحديده")}
            </div>
          </div>


          <div class="info-item">
            <div class="info-label">
              الموقع
            </div>

            <div class="info-value">
              ${escapeHTML(request.location)}
            </div>
          </div>

        </div>


        ${
          request.description
          ?
          `
          <div class="description">

            <div class="description-title">
              وصف المشكلة
            </div>

            <div>
              ${escapeHTML(request.description)}
            </div>

          </div>
          `
          :
          ""
        }


        ${technicianHTML}


        ${priceHTML}


        ${timelineHTML}


        <div class="last-update">
          آخر تحديث:
          ${formatDate(request.updated_at || request.created_at)}
        </div>


        <button
          class="refresh-btn"
          onclick="trackRequest(true)"
        >
          تحديث الطلب الآن
        </button>

      </div>

    `;
  }


  /* ================================
     TECHNICIAN
  ================================= */

  async function getTechnicianHTML(
    technicianId
  ) {

    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("technicians")
        .select(`
          full_name,
          phone,
          service_type,
          status
        `)
        .eq("id", technicianId)
        .maybeSingle();


      if (error) {

        console.error(
          "Technician error:",
          error
        );

        return "";

      }


      if (!data) {
        return "";
      }


      return `

        <div class="technician-card">

          <div class="technician-title">
            الفني المسؤول
          </div>


          <div class="technician-info">

            <div class="info-item">

              <div class="info-label">
                اسم الفني
              </div>

              <div class="info-value">
                ${escapeHTML(data.full_name || "غير محدد")}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                التخصص
              </div>

              <div class="info-value">
                ${escapeHTML(data.service_type || "غير محدد")}
              </div>

            </div>


            <div class="info-item">

              <div class="info-label">
                حالة الفني
              </div>

              <div class="info-value">
                ${escapeHTML(data.status || "غير محدد")}
              </div>

            </div>


            ${
              data.phone
              ?
              `
              <div class="info-item">

                <div class="info-label">
                  هاتف الفني
                </div>

                <div class="info-value">
                  ${escapeHTML(data.phone)}
                </div>

              </div>
              `
              :
              ""
            }

          </div>

        </div>

      `;

    } catch (error) {

      console.error(error);

      return "";

    }
  }


  /* ================================
     PRICE
  ================================= */

  function createPriceHTML(request) {

    /*
      إذا لم يرسل الفني سعرًا بعد
    */

    if (
      request.estimated_cost === null ||
      request.estimated_cost === undefined ||
      request.estimated_cost === ""
    ) {

      return `

        <div class="price-card">

          <div class="price-title">
            عرض السعر
          </div>

          <div class="price-subtitle">
            لم يرسل الفني عرض السعر بعد.
            سيظهر هنا بمجرد قيام الفني بإرسال السعر.
          </div>

          <div class="approval-pending">
            بانتظار عرض السعر من الفني
          </div>

        </div>

      `;
    }


    const amount =
      Number(request.estimated_cost);


    const formattedAmount =
      isNaN(amount)
      ?
      escapeHTML(request.estimated_cost)
      :
      amount.toLocaleString("ar-JO", {
        maximumFractionDigits: 2
      });


    const approval =
      request.customer_approval ||
      "بانتظار موافقة العميل";


    let approvalHTML = "";


    /* بانتظار موافقة العميل */

    if (
      approval ===
      "بانتظار موافقة العميل"
    ) {

      approvalHTML = `

        <div class="approval-pending">

          تم إرسال عرض السعر.
          يرجى مراجعة السعر واختيار الموافقة أو الرفض.

        </div>


        <div class="approval-buttons">

          <button
            class="approve-btn"
            onclick="approvePrice()"
          >
            موافقة على السعر
          </button>


          <button
            class="reject-btn"
            onclick="rejectPrice()"
          >
            رفض السعر
          </button>

        </div>

      `;

    }


    /* موافق */

    else if (
      approval === "موافق"
    ) {

      approvalHTML = `

        <div class="approval-approved">

          تمت الموافقة على السعر بنجاح.

          <br>

          يستطيع الفني الآن الانتقال إلى موقعك
          ومتابعة تنفيذ الطلب.

        </div>

      `;

    }


    /* مرفوض */

    else if (
      approval === "مرفوض"
    ) {

      approvalHTML = `

        <div class="approval-rejected">

          تم رفض عرض السعر من العميل.

          <br>

          سيتمكن الفني من مراجعة الطلب وإرسال
          عرض سعر جديد إذا لزم الأمر.

        </div>

      `;

    }


    /* قيمة أخرى */

    else {

      approvalHTML = `

        <div class="approval-pending">

          حالة الموافقة:
          ${escapeHTML(approval)}

        </div>

      `;

    }


    return `

      <div class="price-card">

        <div class="price-title">
          عرض السعر
        </div>

        <div class="price-subtitle">
          السعر المرسل من الفني لهذا الطلب
        </div>


        <div class="price-amount">

          <span class="number">
            ${formattedAmount}
          </span>

          <span class="currency">
            دينار أردني
          </span>

        </div>


        ${
          request.price_notes
          ?
          `
          <div class="price-notes">

            <strong>
              ملاحظات الفني
            </strong>

            ${escapeHTML(request.price_notes)}

          </div>
          `
          :
          ""
        }


        ${
          request.price_updated_at
          ?
          `
          <div class="price-date">

            تم تحديث السعر:
            ${formatDate(request.price_updated_at)}

          </div>
          `
          :
          ""
        }


        ${approvalHTML}

      </div>

    `;
  }


  /* ================================
     APPROVE PRICE
  ================================= */

  async function approvePrice() {

    if (!currentRequest) {

      showMessage(
        "لم يتم تحميل الطلب.",
        "error"
      );

      return;
    }


    if (
      !currentRequest.estimated_cost
    ) {

      showMessage(
        "لا يوجد عرض سعر للموافقة عليه.",
        "error"
      );

      return;
    }


    const confirmed =
      confirm(
        "هل أنت متأكد من الموافقة على عرض السعر؟"
      );


    if (!confirmed) {
      return;
    }


    showMessage(
      "جاري تسجيل الموافقة...",
      "info"
    );


    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("service_requests")
        .update({

          customer_approval:
            "موافق",

          updated_at:
            new Date().toISOString()

        })
        .eq(
          "id",
          currentRequest.id
        )
        .eq(
          "customer_approval",
          "بانتظار موافقة العميل"
        )
        .select()
        .maybeSingle();


      if (error) {

        console.error(error);

        throw error;

      }


      if (!data) {

        showMessage(
          "تعذر تسجيل الموافقة. ربما تم تحديث الطلب من جهة أخرى.",
          "error"
        );

        await trackRequest(true);

        return;
      }


      currentRequest = data;


      showMessage(
        "تمت الموافقة على السعر بنجاح.",
        "success"
      );


      await trackRequest(true);

    } catch (error) {

      console.error(
        "Approve price error:",
        error
      );

      showMessage(
        "حدث خطأ أثناء تسجيل الموافقة. حاول مرة أخرى.",
        "error"
      );

    }
  }


  /* ================================
     REJECT PRICE
  ================================= */

  async function rejectPrice() {

    if (!currentRequest) {

      showMessage(
        "لم يتم تحميل الطلب.",
        "error"
      );

      return;
    }


    if (
      !currentRequest.estimated_cost
    ) {

      showMessage(
        "لا يوجد عرض سعر لرفضه.",

    }


    const confirmed =

      );

    showMessage(

    try {

      const {

      } = await supabaseClient
        .from("service_requests")
        .update({

          customer_approval:

          updated_at:

        })
        .eq(
          "id",
          currentRequest.id
        )
        .eq(

          "بانتظار موافقة العميل"
        )
        .select()

      }


      if (!data) {

        showMessage(
          "تعذر تسجيل الرفض. ربما تم تحديث الطلب من جهة أخرى.",

  }


  /* ================================
     TIMELINE
  ================================= */

  function createTimeline(
    currentStatus
  ) {

    const statuses = [

      "جديد",

      "قيد المراجعة",

      "تم تعيين فني",

      "الفني في الطريق",

      "بدأ العمل",

      "مكتمل"

    ];


    const currentIndex =
      statuses.indexOf(currentStatus);


    let html = `

      <div class="timeline">

        <div class="timeline-title">
          مراحل الطلب
        </div>

    `;


    statuses.forEach(
      (status, index) => {

        let className = "";


        if (
          currentIndex >= 0 &&
          index < currentIndex
        ) {

          className = "done";

        }


        if (
          status === currentStatus
        ) {

          className += " active";

        }


        html += `

          <div class="timeline-item ${className}">

            ${status}

          </div>

        `;

      }
    );


    html += `
      </div>
    `;


    return html;
  }


  /* ================================
     AUTO REFRESH
  ================================= */

  function startAutoRefresh() {

    stopAutoRefresh();


    refreshTimer =
      setInterval(
        async () => {

          const input =
            document.getElementById(
              "requestNumber"
            );


          if (
            input &&
            input.value.trim()
          ) {

            await trackRequest(true);

          }

        },
        15000
      );

  }


  function stopAutoRefresh() {

    if (refreshTimer) {

      clearInterval(refreshTimer);

      refreshTimer = null;

    }

  }


  /* ================================
     ENTER KEY
  ================================= */

  document
    .getElementById("requestNumber")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          trackRequest();

        }

      }
    );


  /* ================================
     INITIAL
  ================================= */

  const urlParams =
    new URLSearchParams(
      window.location.search
    );


  const urlRequestNumber =
    urlParams.get(
      "request"
    );


  if (urlRequestNumber) {

    document
      .getElementById(
        "requestNumber"
      )
      .value =
      urlRequestNumber;

    trackRequest();

  }

</script>
