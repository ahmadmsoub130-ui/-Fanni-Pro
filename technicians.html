<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الفنيين | فني برو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Tahoma,Arial,sans-serif;
background:
radial-gradient(circle at top right,rgba(37,99,235,.18),transparent 35%),
#07111f;
color:#fff;
min-height:100vh
}

button,input,select,textarea{font-family:inherit}

.hidden{display:none!important}

header{
position:sticky;
top:0;
z-index:20;
background:rgba(7,17,31,.94);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.08)
}

.header-inner{
max-width:1300px;
margin:auto;
padding:14px 18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.brand-icon{
width:45px;
height:45px;
border-radius:13px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
font-weight:bold
}

.brand h1{font-size:18px}
.brand span{color:#94a3b8;font-size:12px}

.header-actions{
display:flex;
gap:8px
}

.header-btn{
border:1px solid #334155;
background:#0f1d30;
color:#fff;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
text-decoration:none;
font-size:13px
}

main{
max-width:1300px;
margin:auto;
padding:25px 18px 50px
}

.page-title{
margin-bottom:22px
}

.page-title h2{
font-size:27px;
margin-bottom:6px
}

.page-title p{
color:#94a3b8;
font-size:14px
}

.layout{
display:grid;
grid-template-columns:360px 1fr;
gap:20px;
align-items:start
}

.panel{
background:#0f1d30;
border:1px solid #1e334d;
border-radius:18px;
padding:20px
}

.panel h3{
margin-bottom:18px;
font-size:18px
}

.field{
margin-bottom:15px
}

.field label{
display:block;
color:#cbd5e1;
font-size:13px;
margin-bottom:7px
}

.field input,
.field select,
.field textarea{
width:100%;
padding:12px;
background:#0b192b;
color:#fff;
border:1px solid #263b54;
border-radius:10px;
outline:none
}

.field textarea{
min-height:90px;
resize:vertical
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#3b82f6
}

.save-btn{
width:100%;
border:none;
padding:13px;
border-radius:10px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;
font-size:15px;
font-weight:bold;
cursor:pointer
}

.save-btn:disabled{
opacity:.6;
cursor:not-allowed
}

.cancel-btn{
width:100%;
border:1px solid #334155;
padding:12px;
border-radius:10px;
background:transparent;
color:#fff;
cursor:pointer;
margin-top:8px
}

.filters{
display:grid;
grid-template-columns:1fr 200px 160px;
gap:10px;
margin-bottom:15px
}

.filters input,
.filters select{
width:100%;
padding:12px;
border-radius:10px;
background:#0b192b;
border:1px solid #263b54;
color:#fff;
outline:none
}

.technicians{
display:grid;
gap:12px
}

.technician-card{
background:#0b192b;
border:1px solid #1e334d;
border-radius:15px;
padding:17px
}

.tech-top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:13px
}

.tech-name{
font-size:18px;
font-weight:bold;
margin-bottom:5px
}

.tech-id{
color:#64748b;
font-size:11px;
direction:ltr;
text-align:right
}

.status{
padding:6px 10px;
border-radius:999px;
font-size:11px;
font-weight:bold;
white-space:nowrap
}

.status.available{
background:rgba(34,197,94,.15);
color:#86efac
}

.status.busy{
background:rgba(245,158,11,.15);
color:#fcd34d
}

.status.offline{
background:rgba(100,116,139,.15);
color:#cbd5e1
}

.tech-info{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-bottom:13px
}

.info{
background:#07111f;
border-radius:9px;
padding:10px
}

.info-label{
color:#64748b;
font-size:10px;
margin-bottom:4px
}

.info-value{
color:#e2e8f0;
font-size:13px;
word-break:break-word
}

.tech-notes{
background:#07111f;
padding:11px;
border-radius:9px;
color:#94a3b8;
font-size:12px;
line-height:1.6;
margin-bottom:13px
}

.actions{
display:flex;
gap:8px
}

.edit-btn,
.delete-btn{
flex:1;
padding:10px;
border-radius:9px;
cursor:pointer;
font-weight:bold;
border:none
}

.edit-btn{
background:#1d4ed8;
color:#fff
}

.delete-btn{
background:#991b1b;
color:#fff
}

.empty{
padding:45px 20px;
text-align:center;
color:#94a3b8;
border:1px dashed #334155;
border-radius:15px
}

.loading{
padding:35px;
text-align:center;
color:#94a3b8
}

.message{
display:none;
margin-bottom:15px;
padding:11px;
border-radius:10px;
font-size:13px
}

.message.error{
display:block;
color:#fca5a5;
background:rgba(239,68,68,.12);
border:1px solid rgba(239,68,68,.2)
}

.message.success{
display:block;
color:#86efac;
background:rgba(34,197,94,.12);
border:1px solid rgba(34,197,94,.2)
}

.toast{
position:fixed;
left:18px;
bottom:18px;
z-index:100;
display:none;
background:#16a34a;
color:#fff;
padding:12px 17px;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,.3)
}

.toast.error{
background:#dc2626
}

.access-denied{
max-width:500px;
margin:80px auto;
padding:35px 25px;
background:#0f1d30;
border:1px solid #1e334d;
border-radius:20px;
text-align:center
}

.access-denied h2{
margin-bottom:12px;
font-size:24px
}

.access-denied p{
color:#94a3b8;
line-height:1.8;
margin-bottom:20px
}

.access-denied a{
display:inline-block;
background:#2563eb;
color:#fff;
padding:11px 18px;
border-radius:10px;
text-decoration:none
}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
.filters{grid-template-columns:1fr 1fr}
.filters input{grid-column:1 / -1}
}

@media(max-width:600px){
main{padding:20px 12px 40px}
.brand span{display:none}
.header-actions .header-btn:first-child{display:none}
.filters{grid-template-columns:1fr}
.filters input{grid-column:auto}
.tech-info{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="brand">

<div class="brand-icon">ف</div>

<div>
<h1>فني برو</h1>
<span>إدارة الفنيين</span>
</div>

</div>

<div class="header-actions">

<a
href="admin.html"
class="header-btn"
>
لوحة الطلبات
</a>

<button
class="header-btn"
id="logoutBtn"
>
تسجيل الخروج
</button>

</div>

</div>

</header>


<main id="mainContent">

<div class="page-title">

<h2>إدارة الفنيين</h2>

<p>
إضافة وتعديل ومتابعة الفنيين في فني برو
</p>

</div>


<div class="layout">


<section class="panel">

<h3 id="formTitle">
إضافة فني جديد
</h3>

<div
id="formMessage"
class="message"
></div>


<form id="technicianForm">

<div class="field">

اسم الفني
</label>

<input
type="text"
id="fullName"

<div class="field">

<label>

</label>

<input
type="tel"
id="phone"
placeholder="07XXXXXXXX"
>

</div>


<div class="field">

<label>
التخصص
</label>

<select id="serviceType">

<option value="">
اختر التخصص
</option>

<option value="تكييف وتبريد">
تكييف وتبريد
</option>

<option value="كهرباء">
كهرباء
</option>

<option value="سباكة">
سباكة
</option>

<option value="صيانة أجهزة منزلية">
صيانة أجهزة منزلية
</option>

<option value="نجارة">
نجارة
</option>

<option value="دهان">
دهان
</option>

<option value="متعدد التخصصات">
متعدد التخصصات
</option>

<option value="أخرى">

</div>


<div class="field">

<label>
حالة الفني
</label>

<select id="status">

<section>

الفنيون
</h3>

<input
type="search"
id="search"
placeholder="بحث باسم الفني أو الهاتف..."
>


<select id="filterService">

<option value="">
كل التخصصات
</option>

<option value="تكييف وتبريد">
تكييف وتبريد
</option>

<option value="كهرباء">
كهرباء
</option>

<option value="سباكة">
سباكة
</option>

<option value="صيانة أجهزة منزلية">
صيانة أجهزة منزلية
</option>

<option value="نجارة">
نجارة
</option>

<option value="دهان">
دهان
</option>

<option value="متعدد التخصصات">
متعدد التخصصات
</option>

<option value="أخرى">
أخرى
</option>

</select>


<select id="filterStatus">

<option value="">
كل الحالات
</option>

<option value="متاح">
متاح
</option>

<option value="مشغول">
مشغول
</option>

<option value="غير متاح">
غير متاح
</option>

</div>

</main>


<div

class="access-denied hidden"
>

<h2>
غير مصرح بالدخول
</h2>

<p>
هذا الحساب لا يملك صلاحية مدير فني برو.
</p>

<a href="index.html">
العودة إلى الموقع
</a>

</div>


<div
id="toast"
class="toast"
></div>


<script>

/* =========================================
SUPABASE
========================================= */

const SUPABASE_URL =
"https://yesmnsztcqnhaqrcgpcs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================
ELEMENTS
========================================= */

const mainContent =
document.getElementById(
"mainContent"
);

const accessDenied =
document.getElementById(
"accessDenied"
);

const form =
document.getElementById(
"technicianForm"
);

const fullName =
document.getElementById(
"fullName"
);

const phone =
document.getElementById(
"phone"
);

const serviceType =
document.getElementById(
"serviceType"
);

const status =
document.getElementById(
"status"
);

const notes =
document.getElementById(
"notes"
);

const saveBtn =
document.getElementById(
"saveBtn"
);

const cancelBtn =
document.getElementById(
"cancelBtn"
);

const formTitle =
document.getElementById(
"formTitle"
);

const formMessage =
document.getElementById(
"formMessage"
);

const search =
document.getElementById(
"search"
);

const filterService =
document.getElementById(
"filterService"
);

const filterStatus =
document.getElementById(
"filterStatus"
);

const container =
document.getElementById(
"techniciansContainer"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);

const toast =
document.getElementById(
"toast"
);


let technicians = [];

let editingId = null;


/* =========================================
START
========================================= */

document.addEventListener(
"DOMContentLoaded",
checkSession
);


/* =========================================
CHECK SESSION + ADMIN
========================================= */

async function checkSession(){

const {
data,
error
} =
await client.auth.getSession();


if(
error ||
!data.session
){

window.location.href =
"admin.html";

return;

}


const user =
data.session.user;


/*
التحقق من وجود الحساب
داخل جدول admin_users
*/

const {
data:adminUser,
error:adminError
} =
await client
.from("admin_users")
.select("user_id")
.eq(
"user_id",
user.id
)
.maybeSingle();


if(adminError){

console.error(
"Admin check:",
adminError
);

showAccessDenied(
"تعذر التحقق من صلاحيات المدير."
);

return;

}


if(!adminUser){

showAccessDenied(
"هذا الحساب لا يملك صلاحية مدير."
);

return;

}


/*
الحساب مدير
نسمح له بإدارة الفنيين
*/

await loadTechnicians();

}


/* =========================================
ACCESS DENIED
========================================= */

function showAccessDenied(
message
){

mainContent.classList.add(
"hidden"
);

accessDenied.classList.remove(
"hidden"
);

accessDenied.querySelector(
"p"
).textContent =
message;

}


/* =========================================
LOAD
========================================= */

async function loadTechnicians(){

container.innerHTML = `
<div class="loading">
جاري تحميل الفنيين...
</div>
`;


const {
data,
error
} =
await client
.from("technicians")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

container.innerHTML = `
<div class="empty">
تعذر تحميل الفنيين.
<br><br>
${escapeHtml(
error.message
)}
</div>
`;

return;

}


technicians =
data || [];

renderTechnicians();

}


/* =========================================
RENDER
========================================= */

function renderTechnicians(){

const query =
search.value
.trim()
.toLowerCase();


const selectedService =
filterService.value;


const selectedStatus =
filterStatus.value;


const filtered =
technicians.filter(
technician => {

const searchable = [

technician.full_name,
technician.phone,
technician.service_type

]
.filter(Boolean)
.join(" ")
.toLowerCase();


const matchesSearch =
!query ||
searchable.includes(
query
);


const matchesService =
!selectedService ||
technician.service_type ===
selectedService;


const matchesStatus =
!selectedStatus ||
technician.status ===
selectedStatus;


return (
matchesSearch &&
matchesService &&
matchesStatus
);

}
);


if(!filtered.length){

container.innerHTML = `
<div class="empty">
لا يوجد فنيون مطابقون للبحث.
</div>
`;

return;

}


container.innerHTML = `
<div class="technicians">
${filtered
.map(
technicianCard
)
.join("")}
</div>
`;

}


/* =========================================
TECHNICIAN CARD
========================================= */

function technicianCard(
technician
){

const statusClass =
technician.status === "متاح"
?
"available"
:
technician.status === "مشغول"
?
"busy"
:
"offline";


return `

<article
class="technician-card"
>

<div class="tech-top">

<div>

<div class="tech-name">
${escapeHtml(
technician.full_name
)}
</div>

<div class="tech-id">
ID:
${escapeHtml(
technician.id
)}
</div>

</div>


<span
class="status ${statusClass}"
>
${escapeHtml(
technician.status ||
"غير محدد"
)}
</span>

</div>


<div class="tech-info">

<div class="info">

<div class="info-label">
الهاتف
</div>

<div class="info-value">
${escapeHtml(
technician.phone ||
"-"
)}
</div>

</div>


<div class="info">

<div class="info-label">
التخصص
</div>

<div class="info-value">
${escapeHtml(
technician.service_type ||
"-"
)}
</div>

</div>

</div>


${
technician.notes
?
`
<div class="tech-notes">
${escapeHtml(
technician.notes
)}
</div>
`
:
""
}


<div class="actions">

<button
class="edit-btn"
onclick="editTechnician('${escapeAttribute(
technician.id
)}')"
>
تعديل
</button>


<button
class="delete-btn"
onclick="deleteTechnician('${escapeAttribute(
technician.id
)}')"
>
حذف
</button>

</div>

</article>

`;

}


/* =========================================
ADD / UPDATE
========================================= */

form.addEventListener(
"submit",
async function(event){

event.preventDefault();


const name =
fullName.value.trim();


if(!name){

showFormMessage(
"اكتب اسم الفني.",
true
);

return;

}


const payload = {

full_name:name,

phone:
phone.value.trim() ||
null,

service_type:
serviceType.value ||
null,

status:
status.value,

notes:
notes.value.trim() ||
null

};


saveBtn.disabled =
true;


saveBtn.textContent =
editingId
?
"جاري التحديث..."
:
"جاري الإضافة...";


let result;


if(editingId){

result =
await client
.from("technicians")
.update(payload)
.eq(
"id",
editingId
);

}else{

result =
await client
.from("technicians")
.insert(
payload
);

}


if(result.error){

showFormMessage(
result.error.message,
true
);


saveBtn.disabled =
false;


saveBtn.textContent =
editingId
?
"حفظ التعديل"
:
"إضافة الفني";

return;

}


showFormMessage(
editingId
?
"تم تحديث بيانات الفني."
:
"تمت إضافة الفني بنجاح.",
false
);


showToast(
editingId
?
"تم تحديث الفني"
:
"تمت إضافة الفني"
);


resetForm();

await loadTechnicians();

}
);


/* =========================================
EDIT
========================================= */

window.editTechnician =
function(id){

const technician =
technicians.find(
item =>
item.id === id
);


if(!technician){
return;
}


editingId =
technician.id;


fullName.value =
technician.full_name ||
"";


phone.value =
technician.phone ||
"";


serviceType.value =
technician.service_type ||
"";


status.value =
technician.status ||
"متاح";


notes.value =
technician.notes ||
"";


formTitle.textContent =
"تعديل بيانات الفني";


saveBtn.textContent =
"حفظ التعديل";


cancelBtn.classList.remove(
"hidden"
);


window.scrollTo({
top:0,
behavior:"smooth"
});

};


/* =========================================
DELETE
========================================= */

window.deleteTechnician =
async function(id){

const technician =
technicians.find(
item =>
item.id === id
);


if(!technician){
return;
}


const confirmed =
confirm(
"هل أنت متأكد من حذف الفني: " +
technician.full_name +
"؟"
);


if(!confirmed){
return;
}


const {
error
} =
await client
.from("technicians")
.delete()
.eq(
"id",
id
);


if(error){

showToast(
"تعذر حذف الفني: " +
error.message,
true
);

return;

}


showToast(
"تم حذف الفني"
);


if(
editingId === id
){

resetForm();

}


await loadTechnicians();

};


/* =========================================
CANCEL
========================================= */

cancelBtn.addEventListener(
"click",
resetForm
);


function resetForm(){

editingId =
null;


form.reset();


status.value =
"متاح";


formTitle.textContent =
"إضافة فني جديد";


saveBtn.textContent =
"إضافة الفني";


saveBtn.disabled =
false;


cancelBtn.classList.add(
"hidden"
);

}


/* =========================================
FILTERS
========================================= */

search.addEventListener(
"input",
renderTechnicians
);

filterService.addEventListener(
"change",
renderTechnicians
);

filterStatus.addEventListener(
"change",
renderTechnicians
);


/* =========================================
LOGOUT
========================================= */

logoutBtn.addEventListener(
"click",
async function(){

await client.auth.signOut();

window.location.href =
"admin.html";

}
);


/* =========================================
MESSAGES
========================================= */

function showFormMessage(
message,
error
){

formMessage.textContent =
message;


formMessage.className =
error
?
"message error"
:
"message success";

}


function showToast(
message,
error=false
){

toast.textContent =
message;

/* =========================================
SECURITY HELPERS
========================================= */

function escapeHtml(
value
){

if(
value === null ||
value === undefined
){

return "";

}


return String(value)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


function escapeAttribute(
value
){

return escapeHtml(
value
);

}
