<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طلب خدمة | فني برو</title>
  <meta name="description" content="أرسل طلب صيانة إلى فني برو واحصل على الخدمة المناسبة.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: #0b5cff;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      opacity: 0.9;
    }

    .container {
      width: min(900px, 92%);
      margin: 35px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 8px;
      color: #0b5cff;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0b5cff;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 12px;
      background: #0b5cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0848c7;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
    }

    .success {
      background: #e8f8ee;
      color: #16733a;
    }

    .error {
      background: #fdecec;
      color: #b42318;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #0b5cff;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>فني برو</h1>
  <p>أرسل طلب الصيانة الخاص بك</p>
</header>

<main class="container">

  <section class="card">

    <h2>طلب خدمة جديد</h2>
    <p class="subtitle">
      أدخل معلوماتك ومعلومات العطل وسنتابع طلبك.
    </p>

    <form id="serviceForm">

      <div class="grid">

        <div class="form-group">
          <label for="name">الاسم الكامل</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="اكتب اسمك"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">رقم الهاتف</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="07XXXXXXXX"
            required
          >
        </div>

      </div>

      <div class="form-group">
        <label for="service">نوع الخدمة</label>

        <select id="service" name="service" required>
          <option value="">اختر نوع الخدمة</option>
          <option value="تكييف وتبريد">تكييف وتبريد</option>
          <option value="كهرباء">كهرباء</option>
          <option value="سباكة">سباكة</option>
          <option value="صيانة أجهزة منزلية">صيانة أجهزة منزلية</option>
          <option value="دهان">دهان</option>
          <option value="نجارة">نجارة</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>

      <div class="form-group">
        <label for="location">الموقع</label>

        <input
          type="text"
          id="location"
          name="location"
          placeholder="المنطقة / العنوان"
          required
        >
      </div>

      <div class="form-group">
        <label for="date">الموعد المفضل</label>

        <input
          type="datetime-local"
          id="date"
          name="date"
        >
      </div>

      <div class="form-group">
        <label for="description">وصف المشكلة</label>

        <textarea
          id="description"
          name="description"
          placeholder="اشرح المشكلة بالتفصيل..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="image">صورة العطل</label>

        <input
          type="file"
          id="image"
          name="image"
          accept="image/*"
        >
      </div>

      <button type="submit" id="submitBtn">
        إرسال طلب الخدمة
      </button>

      <div id="message" class="message"></div>

    </form>

    <a class="back" href="index.html">
      ← العودة إلى الصفحة الرئيسية
    </a>

  </section>

</main>

<script>
  const form = document.getElementById("serviceForm");
  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  form.addEventListener("submit", function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "جاري إرسال الطلب...";

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const service = document.getElementById("service").value;
    const location = document.getElementById("location").value.trim();
    const date = document.getElementById("date").value;
    const description = document.getElementById("description").value.trim();

    if (!name || !phone || !service || !location || !description) {

      message.className = "message error";
      message.textContent = "يرجى تعبئة جميع الحقول المطلوبة.";
      message.style.display = "block";

      button.disabled = false;
      button.textContent = "إرسال طلب الخدمة";

      return;
    }

    /*
      حاليًا يتم تجهيز الطلب فقط.
      في الخطوة التالية سنربطه مباشرة بـ Supabase
      لحفظ الطلبات في قاعدة البيانات.
    */

    setTimeout(() => {

      message.className = "message success";
      message.textContent =
        "تم تجهيز طلبك بنجاح. سيتم ربطه بقاعدة البيانات في الخطوة التالية.";

      message.style.display = "block";

      button.disabled = false;
      button.textContent = "إرسال طلب الخدمة";

    }, 800);

  });
</script>

</body>
</html>
