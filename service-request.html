<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طلب خدمة | فني برو</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      background: #f3f6fb;
      color: #172033;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0757d9, #0b75ff);
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    header p {
      opacity: .92;
    }

    .container {
      width: min(900px, 94%);
      margin: 30px auto 50px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .title {
      color: #0757d9;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #667085;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field {
      margin-bottom: 20px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0757d9;
      box-shadow: 0 0 0 3px rgba(7,87,217,.08);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .file-box {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      background: #f8fafc;
    }

    .file-box input {
      border: 0;
      padding: 5px;
      background: transparent;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 16px;
      background: #0757d9;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      background: #0647b1;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #e8f7ee;
      color: #137333;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #b42318;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #eef5ff;
      border-radius: 15px;
      text-align: center;
    }

    .result strong {
      display: block;
      font-size: 24px;
      color: #0757d9;
      margin-top: 8px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #0757d9;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .card {
        padding: 20px;
      }

      header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>فني برو</h1>
  <p>خدمات الصيانة والفنيين في مكان واحد</p>
</header>

<main class="container">

  <section class="card">

    <h2 class="title">طلب خدمة جديد</h2>

    <p class="subtitle">
      أدخل تفاصيل المشكلة وسنتابع طلبك.
    </p>

    <form id="serviceForm">

      <div class="grid">

        <div class="field">
          <label for="name">الاسم الكامل *</label>

          <input
            id="name"
            type="text"
            placeholder="مثال: أحمد محمد"
            required
          >
        </div>

        <div class="field">
          <label for="phone">رقم الهاتف *</label>

          <input
            id="phone"
            type="tel"
            placeholder="07XXXXXXXX"
            required
          >
        </div>

        <div class="field">
          <label for="service">نوع الخدمة *</label>

          <select id="service" required>
            <option value="">اختر الخدمة</option>
            <option value="تكييف وتبريد">تكييف وتبريد</option>
            <option value="كهرباء">كهرباء</option>
            <option value="سباكة">سباكة</option>
            <option value="صيانة أجهزة منزلية">
              صيانة أجهزة منزلية
            </option>
            <option value="نجارة">نجارة</option>
            <option value="دهان">دهان</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>

        <div class="field">
          <label for="date">الموعد المفضل</label>

          <input
            id="date"
            type="datetime-local"
          >
        </div>

        <div class="field full">

          <label for="location">الموقع *</label>

          <input
            id="location"
            type="text"
            placeholder="المنطقة والعنوان"
            required
          >

        </div>

        <div class="field full">

          <label for="description">
            وصف المشكلة *
          </label>

          <textarea
            id="description"
            placeholder="اكتب تفاصيل العطل أو الخدمة المطلوبة..."
            required
          ></textarea>

        </div>

        <div class="field full">

          <label for="image">
            صورة المشكلة
          </label>

          <div class="file-box">

            <input
              id="image"
              type="file"
              accept="image/*"
            >

          </div>

        </div>

      </div>

      <button
        id="submitBtn"
        type="submit"
      >
        إرسال طلب الخدمة
      </button>

      <div
        id="message"
        class="message"
      ></div>

      <div
        id="result"
        class="result"
      >

        تم إرسال طلبك بنجاح

        <strong id="requestNumber"></strong>

      </div>

    </form>

    <a
      class="back"
      href="index.html"
    >
      ← العودة إلى الصفحة الرئيسية
    </a>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://yesmnsztcqnhaqrcgpcs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const form =
  document.getElementById("serviceForm");

const submitBtn =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");

const result =
  document.getElementById("result");

const requestNumber =
  document.getElementById("requestNumber");


function showMessage(text, type) {

  message.textContent = text;

  message.className =
    "message " + type;

  message.style.display = "block";
}


function createRequestNumber() {

  const now = new Date();

  const random =
    Math.floor(
      1000 + Math.random() * 9000
    );

  return (
    "FP-" +
    now.getFullYear() +
    String(
      now.getMonth() + 1
    ).padStart(2, "0") +
    String(
      now.getDate()
    ).padStart(2, "0") +
    "-" +
    random
  );
}


form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    message.style.display = "none";
    result.style.display = "none";

    submitBtn.disabled = true;

    submitBtn.textContent =
      "جاري إرسال الطلب...";


    try {

      const name =
        document
          .getElementById("name")
          .value
          .trim();

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const service =
        document
          .getElementById("service")
          .value;

      const location =
        document
          .getElementById("location")
          .value
          .trim();

      const date =
        document
          .getElementById("date")
          .value;

      const description =
        document
          .getElementById("description")
          .value
          .trim();


      if (
        !name ||
        !phone ||
        !service ||
        !location ||
        !description
      ) {

        throw new Error(
          "يرجى تعبئة جميع الحقول المطلوبة."
        );

      }


      const generatedNumber =
        createRequestNumber();


      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();


      const requestData = {

        request_number:
          generatedNumber,

        user_id:
          user ? user.id : null,

        customer_name:
          name,

        phone:
          phone,

        service_type:
          service,

        location:
          location,

        preferred_date:
          date
            ? new Date(date).toISOString()
            : null,

        description:
          description,

        status:
          "جديد"

      };


      const {
        error
      } =
        await supabaseClient
          .from("service_requests")
          .insert(requestData);


      if (error) {

        console.error(
          "Supabase Error:",
          error
        );

        throw new Error(
          "تعذر حفظ الطلب في قاعدة البيانات."
        );

      }


      showMessage(
        "تم إرسال طلب الخدمة بنجاح.",
        "success"
      );


      requestNumber.textContent =
        generatedNumber;

      result.style.display =
        "block";


      form.reset();


    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "حدث خطأ غير متوقع.",
        "error"
      );

    }


    submitBtn.disabled =
      false;

    submitBtn.textContent =
      "إرسال طلب الخدمة";

  });

</script>

</body>
</html>
