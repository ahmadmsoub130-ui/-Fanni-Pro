<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طلب خدمة صيانة | فني برو</title>

  <meta name="description" content="أرسل طلب صيانة إلى فني برو وتابع حالة طلبك باستخدام رقم الطلب.">
  <meta name="theme-color" content="#07152f">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(102,92,255,.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0,174,234,.12), transparent 30%),
        #050b1b;
      color: #fff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
    }

    header {
      background: rgba(5,11,27,.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
    }

    .logo span {
      color: #756dff;
    }

    .back {
      color: #aeb9ce;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .back:hover {
      background: rgba(255,255,255,.06);
      color: #fff;
    }

    main {
      padding: 55px 0 80px;
    }

    .title {
      text-align: center;
      margin-bottom: 35px;
    }

    .title .badge {
      display: inline-block;
      color: #aaa4ff;
      background: rgba(102,92,255,.12);
      border: 1px solid rgba(102,92,255,.3);
      padding: 8px 15px;
      border-radius: 30px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .title h1 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .title p {
      color: #96a3b8;
      line-height: 1.8;
    }

    .form-card {
      background: rgba(12,22,48,.9);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0,0,0,.3);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #dce4f1;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.1);
      background: #09142d;
      color: #fff;
      border-radius: 13px;
      padding: 14px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #7168ff;
      box-shadow: 0 0 0 3px rgba(102,92,255,.1);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #65738b;
    }

    .hint {
      color: #738198;
      font-size: 12px;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      margin-top: 25px;
      min-height: 55px;
      border-radius: 14px;
      background: linear-gradient(135deg,#665cff,#8d5cff);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .25s;
      font-family: inherit;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(102,92,255,.25);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 22px;
      border-radius: 16px;
      padding: 20px;
      line-height: 1.8;
    }

    .message.success {
      display: block;
      background: rgba(20,160,100,.12);
      border: 1px solid rgba(20,200,120,.25);
      color: #8ff0bd;
    }

    .message.error {
      display: block;
      background: rgba(220,50,70,.1);
      border: 1px solid rgba(220,70,90,.25);
      color: #ff9da9;
    }

    .request-number {
      display: inline-block;
      margin: 10px 0;
      padding: 10px 15px;
      border-radius: 10px;
      background: rgba(255,255,255,.07);
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      direction: ltr;
    }

    .result-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .result-buttons a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 11px 17px;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
    }

    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      padding: 30px 0;
      color: #718097;
      text-align: center;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .form-card {
        padding: 20px;
      }

      .title h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container navbar">

    <a href="index.html" class="logo">
      فني <span>برو</span>
    </a>

    <a href="index.html" class="back">
      ← الرئيسية
    </a>

  </div>
</header>


<main>

  <div class="container">

    <div class="title">

      <div class="badge">
        فني برو
      </div>

      <h1>
        طلب خدمة صيانة
      </h1>

      <p>
        أدخل بياناتك ووصف المشكلة وسنقوم بتسجيل طلبك.
      </p>

    </div>


    <div class="form-card">

      <form id="serviceForm">

        <div class="form-grid">

          <!-- الاسم -->

          <div class="field">

            <label for="customerName">
              الاسم الكامل *
            </label>

            <input
              type="text"
              id="customerName"
              placeholder="أدخل اسمك الكامل"
              required
              autocomplete="name"
            >

          </div>


          <!-- الهاتف -->

          <div class="field">

            <label for="phone">
              رقم الهاتف *
            </label>

            <input
              type="tel"
              id="phone"
              placeholder="07XXXXXXXX"
              required
              inputmode="numeric"
              maxlength="10"
              autocomplete="tel"
            >

            <div class="hint">
              مثال: 0791234567
            </div>

          </div>


          <!-- نوع الخدمة -->

          <div class="field">

            <label for="serviceType">
              نوع الخدمة *
            </label>

            <select id="serviceType" required>

              <option value="">
                اختر نوع الخدمة
              </option>

              <option value="تكييف وتبريد">
                تكييف وتبريد
              </option>

              <option value="كهرباء">
                كهرباء
              </option>

              <option value="سباكة">
                سباكة
              </option>

              <option value="صيانة أجهزة منزلية">
                أجهزة منزلية
              </option>

              <option value="نجارة">
                نجارة
              </option>

              <option value="دهان">
                دهان
              </option>

              <option value="صيانة عامة">
                صيانة عامة
              </option>

              <option value="أخرى">
                خدمات أخرى
              </option>

            </select>

          </div>


          <!-- التاريخ -->

          <div class="field">

            <label for="preferredDate">
              التاريخ المفضل
            </label>

            <input
              type="date"
              id="preferredDate"
            >

          </div>


          <!-- الموقع -->

          <div class="field full">

            <label for="location">
              الموقع / العنوان *
            </label>

            <input
              type="text"
              id="location"
              placeholder="أدخل المنطقة والعنوان بالتفصيل"
              required
              autocomplete="street-address"
            >

          </div>


          <!-- الوصف -->

          <div class="field full">

            <label for="description">
              وصف المشكلة *
            </label>

            <textarea
              id="description"
              placeholder="اشرح المشكلة أو العطل بالتفصيل..."
              required
            ></textarea>

          </div>


          <!-- الصورة -->

          <div class="field full">

            <label for="image">
              صورة للمشكلة
            </label>

            <input
              type="file"
              id="image"
              accept="image/*"
            >

            <div class="hint">
              اختياري — الحد الأقصى لحجم الصورة 5MB.
            </div>

          </div>

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          إرسال طلب الصيانة
        </button>

      </form>


      <div id="message" class="message"></div>

    </div>

  </div>

</main>


<footer>
  <div class="container">
    © 2026 فني برو — جميع الحقوق محفوظة
  </div>
</footer>


<script>

  /* ==========================================
     إعداد Supabase
  ========================================== */

  const SUPABASE_URL =
    "https://yesmnsztcqnhaqrcgpcs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     عناصر الصفحة
  ========================================== */

  const form =
    document.getElementById("serviceForm");

  const customerName =
    document.getElementById("customerName");

  const phone =
    document.getElementById("phone");

  const serviceType =
    document.getElementById("serviceType");

  const preferredDate =
    document.getElementById("preferredDate");

  const locationInput =
    document.getElementById("location");

  const description =
    document.getElementById("description");

  const imageInput =
    document.getElementById("image");

  const submitBtn =
    document.getElementById("submitBtn");

  const message =
    document.getElementById("message");


  /* ==========================================
     التاريخ الأدنى = اليوم
  ========================================== */

  const today =
    new Date().toISOString().split("T")[0];

  preferredDate.min = today;


  /* ==========================================
     استقبال الخدمة من index.html
     
     مثال:
     service-request.html?service=تكييف%20وتبريد
  ========================================== */

  const urlParams =
    new URLSearchParams(window.location.search);

  const selectedService =
    urlParams.get("service");

  if (selectedService) {

    const optionExists =
      Array.from(serviceType.options)
        .some(option =>
          option.value === selectedService
        );

    if (optionExists) {

      serviceType.value =
        selectedService;

    }

  }


  /* ==========================================
     رقم الطلب
  ========================================== */

  function generateRequestNumber() {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(now.getDate())
        .padStart(2, "0");

    const random =
      Math.floor(
        100000 +
        Math.random() * 900000
      );

    return `FP-${year}${month}${day}-${random}`;

  }


  /* ==========================================
     إظهار الرسالة
  ========================================== */

  function showMessage(type, html) {

    message.className =
      "message " + type;

    message.innerHTML =
      html;

    message.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  }


  /* ==========================================
     التحقق من رقم الهاتف الأردني
  ========================================== */

  function validJordanPhone(value) {

    return /^07[0-9]{8}$/.test(value);

  }


  /* ==========================================
     إرسال الطلب
  ========================================== */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      message.className = "message";
      message.innerHTML = "";

      const name =
        customerName.value.trim();

      const phoneValue =
        phone.value.trim();

      const service =
        serviceType.value;

      const date =
        preferredDate.value || null;

      const location =
        locationInput.value.trim();

      const problem =
        description.value.trim();

      const image =
        imageInput.files[0];


      /* ------------------------------
         التحقق
      ------------------------------ */

      if (name.length < 2) {

        showMessage(
          "error",
          "يرجى إدخال الاسم الكامل."
        );

        return;

      }


      if (!validJordanPhone(phoneValue)) {

        showMessage(
          "error",
          "يرجى إدخال رقم هاتف أردني صحيح مثل 0791234567."
        );

        return;

      }


      if (!service) {

        showMessage(
          "error",
          "يرجى اختيار نوع الخدمة."
        );

        return;

      }


      if (!location) {

        showMessage(
          "error",
          "يرجى إدخال الموقع أو العنوان."
        );

        return;

      }


      if (problem.length < 5) {

        showMessage(
          "error",
          "يرجى كتابة وصف واضح للمشكلة."
        );

        return;

      }


      if (image) {

        if (!image.type.startsWith("image/")) {

          showMessage(
            "error",
            "الملف المرفوع يجب أن يكون صورة."
          );

          return;

        }

        if (image.size > 5 * 1024 * 1024) {

          showMessage(
            "error",
            "حجم الصورة يجب ألا يتجاوز 5MB."
          );

          return;

        }

      }


      /* ------------------------------
         بدء الإرسال
      ------------------------------ */

      submitBtn.disabled = true;

      submitBtn.textContent =
        "جاري إرسال الطلب...";


      try {

        const requestNumber =
          generateRequestNumber();


        /* ==================================
           رفع الصورة إن وجدت
        ================================== */

        let imageUrl = null;

        if (image) {

          const extension =
            image.name
              .split(".")
              .pop()
              .toLowerCase();

          const filePath =
            `requests/${requestNumber}.${extension}`;


          const {
            error: uploadError
          } =
            await supabaseClient
              .storage
              .from("service-images")
              .upload(
                filePath,
                image,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType: image.type
                }
              );


          if (uploadError) {

            console.error(
              "Image upload error:",
              uploadError
            );

            throw new Error(
              "تعذر رفع الصورة. تأكد من إعداد Storage في Supabase."
            );

          }


          const {
            data: publicData
          } =
            supabaseClient
              .storage
              .from("service-images")
              .getPublicUrl(filePath);


          imageUrl =
            publicData.publicUrl;

        }


        /* ==================================
           الحصول على المستخدم الحالي
           إن كان مسجل الدخول
        ================================== */

        let currentUser = null;

        try {

          const {
            data: sessionData
          } =
            await supabaseClient
              .auth
              .getSession();

          currentUser =
            sessionData?.session?.user || null;

        } catch (sessionError) {

          console.warn(
            "Session check:",
            sessionError
          );

        }


        /* ==================================
           تجهيز بيانات الطلب
        ================================== */

        const requestData = {

          request_number:
            requestNumber,

          customer_name:
            name,

          phone:
            phoneValue,

          service_type:
            service,

          preferred_date:
            date,

          location:
            location,

          description:
            problem,

          status:
            "جديد",

          priority:
            "عادي",

          image_url:
            imageUrl

        };


        /*
          إذا كان جدول service_requests
          يحتوي على user_id، نضيفه فقط
          عند وجود مستخدم مسجل.
        */

        if (currentUser) {

          requestData.user_id =
            currentUser.id;

        }


        /* ==================================
           حفظ الطلب في Supabase
        ================================== */

        const {
          data,
          error
        } =
          await supabaseClient
            .from("service_requests")
            .insert([requestData])
            .select()
            .single();


        if (error) {

          console.error(
            "Supabase insert error:",
            error
          );

          /*
            إذا كان سبب الخطأ أن user_id
            غير موجود في الجدول، نحاول
            الحفظ بدون user_id.
          */

          if (
            currentUser &&
            error.message &&
            error.message
              .toLowerCase()
              .includes("user_id")
          ) {

            delete requestData.user_id;

            const retry =
              await supabaseClient
                .from("service_requests")
                .insert([requestData])
                .select()
                .single();

            if (retry.error) {

              throw retry.error;

            }

          } else {

            throw error;

          }

        }


        /* ==================================
           نجاح
        ================================== */

        showMessage(
          "success",

          `
            <strong>
              تم إرسال طلب الصيانة بنجاح.
            </strong>

            <br>

            رقم طلبك:

            <br>

            <span class="request-number">
              ${requestNumber}
            </span>

            <br>

            احتفظ برقم الطلب لاستخدامه في متابعة حالة الطلب.

            <div class="result-buttons">

              <a href="track-request.html?request=${encodeURIComponent(requestNumber)}">
                تتبع الطلب
              </a>

              <a href="index.html">
                العودة للرئيسية
              </a>

            </div>
          `
        );


        /* تفريغ النموذج */

        form.reset();

        /*
          إعادة اختيار الخدمة إذا كانت
          الصفحة مفتوحة من بطاقة خدمة.
        */

        if (selectedService) {

          serviceType.value =
            selectedService;

        }


      } catch (error) {

        console.error(error);

        let errorText =
          "حدث خطأ أثناء إرسال الطلب.";

        if (error?.message) {

          errorText +=
            "<br><br>" +
            "التفاصيل: " +
            error.message;

        }

        showMessage(
          "error",
          errorText
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          "إرسال طلب الصيانة";

      }

    }
  );

</script>

</body>
</html>
