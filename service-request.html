<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلب صيانة | فني برو</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
background:
radial-gradient(circle at top right,rgba(37,99,235,.20),transparent 35%),
radial-gradient(circle at bottom left,rgba(124,58,237,.14),transparent 35%),
#07111f;
color:#fff;
padding:18px
}

.container{
max-width:720px;
margin:25px auto
}

.header{
text-align:center;
margin-bottom:22px
}

.logo{
width:65px;
height:65px;
margin:auto;
margin-bottom:13px;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:bold;
background:linear-gradient(135deg,#2563eb,#7c3aed);
box-shadow:0 15px 40px rgba(37,99,235,.25)
}

h1{
font-size:27px;
margin-bottom:7px
}

.subtitle{
color:#94a3b8;
font-size:13px;
line-height:1.7
}

.card{
background:rgba(15,29,48,.96);
border:1px solid #1e334d;
border-radius:22px;
padding:22px;
box-shadow:0 20px 50px rgba(0,0,0,.25)
}

.form-group{
margin-bottom:16px
}

label{
display:block;
font-size:12px;
color:#cbd5e1;
margin-bottom:7px
}

.required{
color:#60a5fa
}

input,
select,
textarea{
width:100%;
padding:13px;
border-radius:11px;
border:1px solid #263b54;
background:#0b192b;
color:#fff;
outline:none;
font-family:inherit;
font-size:14px
}

input:focus,
select:focus,
textarea:focus{
border-color:#3b82f6;
box-shadow:0 0 0 3px rgba(59,130,246,.08)
}

textarea{
min-height:110px;
resize:vertical;
line-height:1.7
}

select{
cursor:pointer
}

input[type="file"]{
padding:10px;
font-size:12px
}

.file-note{
font-size:10px;
color:#64748b;
margin-top:5px
}

.submit-btn{
width:100%;
border:0;
border-radius:12px;
padding:15px;
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:#fff;
font-weight:bold;
font-size:15px;
cursor:pointer;
margin-top:5px
}

.submit-btn:disabled{
opacity:.6;
cursor:not-allowed
}

.message{
display:none;
padding:13px;
border-radius:11px;
margin-bottom:15px;
font-size:13px;
line-height:1.7
}

.message.error{
display:block;
background:rgba(239,68,68,.12);
border:1px solid rgba(239,68,68,.3);
color:#fca5a5
}

.success{
display:none;
margin-top:18px;
padding:20px;
border-radius:16px;
background:rgba(34,197,94,.10);
border:1px solid rgba(34,197,94,.28);
text-align:center
}

.success-icon{
font-size:40px;
margin-bottom:8px
}

.success h2{
font-size:20px;
margin-bottom:8px
}

.success p{
color:#a7f3d0;
font-size:12px;
line-height:1.8
}

.request-number-box{
margin:16px 0;
padding:14px;
background:#07111f;
border-radius:12px;
border:1px dashed #2563eb
}

.request-number-label{
font-size:10px;
color:#64748b;
margin-bottom:6px
}

.request-number{
font-size:21px;
font-weight:bold;
color:#60a5fa;
direction:ltr;
letter-spacing:1px
}

.success-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
margin-top:14px
}

.action-btn{
display:block;
padding:12px;
border-radius:10px;
text-decoration:none;
font-size:12px;
font-weight:bold
}

.track-btn{
background:#2563eb;
color:#fff
}

.new-btn{
background:#172a40;
color:#cbd5e1;
border:1px solid #263b54
}

.home-link{
display:block;
text-align:center;
margin-top:18px;
color:#93c5fd;
text-decoration:none;
font-size:12px
}

.footer{
text-align:center;
color:#475569;
font-size:10px;
margin-top:20px;
line-height:1.7
}

@media(max-width:550px){

body{
padding:10px
}

.container{
margin:12px auto
}

.card{
padding:17px
}

h1{
font-size:23px
}

.success-actions{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="logo">ف</div>

<h1>طلب خدمة صيانة</h1>

<div class="subtitle">
اطلب فنيًا لمختلف أعمال الصيانة والخدمات المنزلية
</div>

</div>


<div class="card">

<div
id="errorMessage"
class="message"
></div>


<form id="requestForm">

<div class="form-group">

<label>
الاسم الكامل
<span class="required">*</span>
</label>

<input
type="text"
id="customerName"
placeholder="أدخل اسمك الكامل"
required
maxlength="100"
>

</div>


<div class="form-group">

<label>
رقم الهاتف
<span class="required">*</span>
</label>

<input
type="tel"
id="phone"
placeholder="07XXXXXXXX"
inputmode="numeric"
required
maxlength="10"
>

</div>


<div class="form-group">

<label>
نوع الخدمة
<span class="required">*</span>
</label>

<select
id="serviceType"
required
>

<option value="">
اختر نوع الصيانة
</option>

<option value="تكييف وتبريد">
تكييف وتبريد
</option>

<option value="كهرباء">
كهرباء
</option>

<option value="سباكة">
سباكة
</option>

<option value="صيانة أجهزة منزلية">
صيانة أجهزة منزلية
</option>

<option value="نجارة">
نجارة
</option>

<option value="دهان">
دهان
</option>

<option value="أخرى">
أخرى
</option>

</select>

</div>


<div class="form-group">

<label>
التاريخ والوقت المفضل
</label>

<input
type="datetime-local"
id="preferredDate"
>

</div>


<div class="form-group">

<label>
الموقع
<span class="required">*</span>
</label>

<input
type="text"
id="location"
placeholder="المحافظة / المنطقة / العنوان"
required
maxlength="250"
>

</div>


<div class="form-group">

<label>
وصف المشكلة
<span class="required">*</span>
</label>

<textarea
id="description"
placeholder="اشرح المشكلة أو العمل المطلوب بالتفصيل..."
required
maxlength="2000"
></textarea>

</div>


<div class="form-group">

<label>
صورة للعطل — اختياري
</label>

<input
type="file"
id="image"
accept="image/*"
>

<div class="file-note">
يمكنك إرفاق صورة واضحة للعطل لمساعدة الفني.
</div>

</div>


<button
type="submit"
class="submit-btn"
id="submitBtn"
>
إرسال طلب الصيانة
</button>

</form>


<div
id="successBox"
class="success"
>

<div class="success-icon">
✓
</div>

<h2>
تم إرسال طلبك بنجاح
</h2>

<p>
احتفظ برقم الطلب التالي لمتابعة حالة طلبك.
</p>


<div class="request-number-box">

<div class="request-number-label">
رقم طلبك
</div>

<div
class="request-number"
id="successRequestNumber"
>
-
</div>

</div>


<div class="success-actions">

<a
href="track-request.html"
class="action-btn track-btn"
id="trackBtn"
>
تتبع طلبك
</a>

<a
href="service-request.html"
class="action-btn new-btn"
>
طلب جديد
</a>

</div>

</div>

</div>


<a
href="track-request.html"
class="home-link"
>
لديك طلب سابق؟ تتبع طلبك برقم الطلب
</a>


<div class="footer">
فني برو — خدمات الصيانة في مكان واحد
</div>

</div>


<script>

const SUPABASE_URL =
"https://yesmnsztcqnhaqrcgpcs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const form =
document.getElementById(
"requestForm"
);

const submitBtn =
document.getElementById(
"submitBtn"
);

const errorMessage =
document.getElementById(
"errorMessage"
);

const successBox =
document.getElementById(
"successBox"
);


form.addEventListener(
"submit",
async function(event){

event.preventDefault();

hideError();


const customerName =
document.getElementById(
"customerName"
).value.trim();

const phone =
document.getElementById(
"phone"
).value.trim();

const serviceType =
document.getElementById(
"serviceType"
).value;

const preferredDate =
document.getElementById(
"preferredDate"
).value;

const location =
document.getElementById(
"location"
).value.trim();

const description =
document.getElementById(
"description"
).value.trim();

const imageFile =
document.getElementById(
"image"
).files[0];


if(!customerName){

showError(
"أدخل الاسم الكامل."
);

return;

}


if(!/^07\d{8}$/.test(phone)){

showError(
"أدخل رقم هاتف أردني صحيح بالشكل 07XXXXXXXX."
);

return;

}


if(!serviceType){

showError(
"اختر نوع الخدمة."
);

return;

}


if(!location){

showError(
"أدخل موقع الخدمة."
);

return;

}


if(!description){

showError(
"اكتب وصف المشكلة."
);

return;

}


if(imageFile){

const maxSize =
5 * 1024 * 1024;

if(imageFile.size > maxSize){

showError(
"حجم الصورة يجب ألا يتجاوز 5 ميجابايت."
);

return;

}

}


submitBtn.disabled = true;
submitBtn.textContent =
"جاري إرسال الطلب...";


try{

const requestNumber =
generateRequestNumber();


let imageUrl = null;


/* رفع الصورة إن وجدت */

if(imageFile){

const extension =
getExtension(
imageFile.name
);

const filePath =
"requests/" +
requestNumber +
"." +
extension;


const {
error: uploadError
} = await client
.storage
.from("service-images")
.upload(
filePath,
imageFile,
{
upsert:false,
contentType:
imageFile.type
}
);


if(!uploadError){

const {
data:urlData
} = client
.storage
.from("service-images")
.getPublicUrl(
filePath
);

imageUrl =
urlData.publicUrl;

}

}


/* إنشاء الطلب */

const {
data,
error
} = await client
.from("service_requests")
.insert({

request_number:
requestNumber,

customer_name:
customerName,

phone:
phone,

service_type:
serviceType,

location:
location,

preferred_date:
preferredDate
?
new Date(
preferredDate
).toISOString()
:
null,

description:
description,

status:
"جديد",

priority:
"عادي",

image_url:
imageUrl

})
.select()
.single();


if(error){

console.error(error);

showError(
"تعذر إرسال الطلب. تأكد من اتصال الإنترنت وحاول مرة أخرى."
);

submitBtn.disabled = false;
submitBtn.textContent =
"إرسال طلب الصيانة";

return;

}


/* نجاح */

form.style.display =
"none";

successBox.style.display =
"block";


document.getElementById(
"successRequestNumber"
).textContent =
data.request_number;


/* تمرير الرقم إلى صفحة التتبع */

const trackBtn =
document.getElementById(
"trackBtn"
);

trackBtn.href =
"track-request.html?request=" +
encodeURIComponent(
data.request_number
);


}catch(error){

console.error(error);

showError(
"حدث خطأ غير متوقع. حاول مرة أخرى."
);

submitBtn.disabled = false;
submitBtn.textContent =
"إرسال طلب الصيانة";

}

});


/* ======================================
GENERATE REQUEST NUMBER
====================================== */

function generateRequestNumber(){

const now =
new Date();

const year =
now.getFullYear();

const month =
String(
now.getMonth()+1
).padStart(2,"0");

const day =
String(
now.getDate()
).padStart(2,"0");

const random =
Math.floor(
100000 +
Math.random()*900000
);

return (
"FP-" +
year +
month +
day +
"-" +
random
);

}


/* ======================================
FILE EXTENSION
====================================== */

function getExtension(
filename
){

const parts =
filename.split(".");

if(parts.length < 2){
return "jpg";
}

return parts
.pop()
.toLowerCase()
.replace(/[^a-z0-9]/g,"");

}


/* ======================================
ERROR
====================================== */

function showError(
text
){

errorMessage.textContent =
text;

errorMessage.className =
"message error";

errorMessage.scrollIntoView({
behavior:"smooth",
block:"center"
});

}


function hideError(){

errorMessage.textContent =
"";

errorMessage.className =
"message";

}

</script>

</body>
</html>
