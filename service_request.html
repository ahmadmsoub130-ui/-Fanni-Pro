<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طلبات الخدمة | فني برو</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.18), transparent 35%),
        linear-gradient(135deg, #07111f, #0b1628 55%, #101827);
      color: #fff;
      min-height: 100vh;
    }

    .page {
      width: min(1250px, 94%);
      margin: auto;
      padding: 25px 0 50px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 28px;
      font-weight: 900;
    }

    .brand span {
      color: #60a5fa;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    a {
      font-family: inherit;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-secondary {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
    }

    .btn-danger {
      background: #dc2626;
      color: #fff;
    }

    .btn-success {
      background: #16a34a;
      color: #fff;
    }

    .hero {
      background: rgba(15,23,42,.88);
      border: 1px solid #243247;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .hero p {
      margin: 0;
      color: #94a3b8;
    }

    .user-box {
      margin-top: 15px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: rgba(15,23,42,.9);
      border: 1px solid #243247;
      border-radius: 18px;
      padding: 20px;
    }

    .stat-title {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 900;
    }

    .layout {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: rgba(15,23,42,.92);
      border: 1px solid #243247;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #0b1220;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 11px;
      padding: 12px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }

    textarea {
      min-height: 95px;
      resize: vertical;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      margin-bottom: 15px;
    }

    .requests {
      display: grid;
      gap: 13px;
    }

    .request {
      background: #0b1220;
      border: 1px solid #26364d;
      border-radius: 16px;
      padding: 17px;
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .request-number {
      font-size: 17px;
      font-weight: 900;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-new {
      background: rgba(37,99,235,.18);
      color: #93c5fd;
    }

    .status-progress {
      background: rgba(245,158,11,.18);
      color: #fcd34d;
    }

    .status-done {
      background: rgba(22,163,74,.18);
      color: #86efac;
    }

    .status-cancelled {
      background: rgba(220,38,38,.18);
      color: #fca5a5;
    }

    .priority-normal {
      color: #cbd5e1;
    }

    .priority-medium {
      color: #fcd34d;
    }

    .priority-urgent {
      color: #fb923c;
    }

    .priority-emergency {
      color: #f87171;
      font-weight: 900;
    }

    .request-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 15px;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .request-info strong {
      color: #fff;
    }

    .description {
      background: #111c2e;
      border-radius: 10px;
      padding: 12px;
      color: #cbd5e1;
      line-height: 1.7;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }

    .request-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #64748b;
      border: 1px dashed #334155;
      border-radius: 15px;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 12px;
      font-weight: 700;
    }

    .message.success {
      display: block;
      background: rgba(22,163,74,.15);
      color: #86efac;
      border: 1px solid rgba(22,163,74,.35);
    }

    .message.error {
      display: block;
      background: rgba(220,38,38,.15);
      color: #fca5a5;
      border: 1px solid rgba(220,38,38,.35);
    }

    .loading {
      position: fixed;
      inset: 0;
      background: #07111f;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-weight: 900;
      font-size: 18px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .page {
        width: 94%;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .two,
      .request-info,
      .search-row {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 24px;
      }

      .card {
        padding: 17px;
      }

      .btn {
        width: 100%;
      }

      .top-actions {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div id="loading" class="loading">
  جاري التحقق من تسجيل الدخول...
</div>

<div id="app" class="hidden">

  <div class="page">

    <div class="topbar">
      <div class="brand">⚒ <span>فني</span> برو</div>

      <div class="top-actions">
        <a class="btn btn-secondary" href="index.html">الرئيسية</a>
        <a class="btn btn-secondary" href="customers.html">العملاء</a>
        <button class="btn btn-danger" onclick="logout()">تسجيل الخروج</button>
      </div>
    </div>

    <section class="hero">
      <h1>طلبات الخدمة</h1>
      <p>إدارة طلبات العملاء ومتابعة حالة كل طلب من مكان واحد.</p>

      <div id="userBox" class="user-box"></div>
    </section>

    <div id="message" class="message"></div>

    <section class="stats">

      <div class="stat">
        <div class="stat-title">إجمالي الطلبات</div>
        <div id="totalCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">طلبات جديدة</div>
        <div id="newCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">قيد التنفيذ</div>
        <div id="progressCount" class="stat-value">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">مكتملة</div>
        <div id="doneCount" class="stat-value">0</div>
      </div>

    </section>

    <section class="layout">

      <div class="card">

        <h2 id="formTitle">إضافة طلب خدمة</h2>

        <form id="requestForm">

          <input type="hidden" id="editId">

          <div class="field">
            <label>رقم الطلب</label>
            <input id="requestNumber" readonly>
          </div>

          <div class="field">
            <label>تاريخ الطلب</label>
            <input id="requestDate" type="date" required>
          </div>

          <div class="field">
            <label>العميل المحفوظ</label>
            <select id="customerSelect">
              <option value="">-- اختيار عميل --</option>
            </select>
          </div>

          <div class="two">

            <div class="field">
              <label>اسم العميل</label>
              <input id="customerName" placeholder="اسم العميل" required>
            </div>

            <div class="field">
              <label>رقم الهاتف</label>
              <input id="customerPhone" type="tel" placeholder="07xxxxxxxx">
            </div>

          </div>

          <div class="field">
            <label>نوع الخدمة</label>

            <select id="serviceType" required>

              <option value="">-- اختر نوع الخدمة --</option>

              <option>تكييف وتبريد</option>
              <option>كهرباء</option>
              <option>سباكة</option>
              <option>صيانة عامة</option>
              <option>أجهزة منزلية</option>
              <option>كاميرات ومراقبة</option>
              <option>شبكات وإنترنت</option>
              <option>تدفئة</option>
              <option>صيانة سيارات</option>
              <option>نجارة</option>
              <option>دهان وتشطيبات</option>
              <option>تنظيف</option>
              <option>حدائق ومسابح</option>
              <option>خدمات منزلية</option>
              <option>مقاولات</option>
              <option>أخرى</option>

            </select>
          </div>

          <div class="two">

            <div class="field">
              <label>الأولوية</label>

              <select id="priority">
                <option value="عادية">عادية</option>
                <option value="متوسطة">متوسطة</option>
                <option value="عاجلة">عاجلة</option>
                <option value="طوارئ">طوارئ</option>
              </select>
            </div>

            <div class="field">
              <label>حالة الطلب</label>

              <select id="status">

                <option value="جديد">جديد</option>
                <option value="قيد التنفيذ">قيد التنفيذ</option>
                <option value="مكتمل">مكتمل</option>
                <option value="ملغي">ملغي</option>

              </select>
            </div>

          </div>

          <div class="field">
            <label>موعد الخدمة</label>
            <input id="appointment" type="datetime-local">
          </div>

          <div class="field">
            <label>الفني المسؤول</label>
            <input id="technician" placeholder="اسم الفني">
          </div>

          <div class="field">
            <label>وصف المشكلة / الطلب</label>
            <textarea id="description" required placeholder="اكتب تفاصيل طلب العميل..."></textarea>
          </div>

          <div class="field">
            <label>ملاحظات</label>
            <textarea id="notes" placeholder="أي ملاحظات إضافية..."></textarea>
          </div>

          <div class="form-actions">

            <button type="submit" class="btn btn-primary">
              💾 حفظ الطلب
            </button>

            <button type="button"
                    class="btn btn-secondary"
                    onclick="resetForm()">
              ↺ طلب جديد
            </button>

          </div>

        </form>

      </div>

      <div class="card">

        <h2>قائمة الطلبات</h2>

        <div class="search-row">

          <input
            id="search"
            placeholder="ابحث باسم العميل أو رقم الطلب أو الهاتف..."
            oninput="renderRequests()"
          >

          <select id="statusFilter" onchange="renderRequests()">

            <option value="">كل الحالات</option>
            <option value="جديد">جديد</option>
            <option value="قيد التنفيذ">قيد التنفيذ</option>
            <option value="مكتمل">مكتمل</option>
            <option value="ملغي">ملغي</option>

          </select>

        </div>

        <div id="requestsList" class="requests"></div>

      </div>

    </section>

  </div>

</div>

<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://yesmnsztcqnhaqrcgpcs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     STORAGE
  ================================= */

  const STORAGE_KEY = "fanniProServiceRequests";
  const COUNTER_KEY = "fanniProRequestCounter";

  let currentUser = null;
  let requests = [];


  /* ================================
     START
  ================================= */

  document.addEventListener("DOMContentLoaded", async () => {

    try {

      const {
        data: {
          user
        },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {

        window.location.replace("login.html");
        return;

      }

      currentUser = user;

      document.getElementById("userBox").textContent =
        "الحساب: " + (user.email || "");

      document.getElementById("loading").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");

      loadCustomers();
      loadRequests();
      setDefaultDate();
      resetForm();

    } catch (error) {

      console.error(error);

      window.location.replace("login.html");

    }

  });


  /* ================================
     AUTH
  ================================= */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.replace("login.html");

  }


  /* ================================
     CUSTOMERS
  ================================= */

  function loadCustomers() {

    const select =
      document.getElementById("customerSelect");

    select.innerHTML =
      '<option value="">-- اختيار عميل --</option>';

    let customers = [];

    try {

      customers =
        JSON.parse(
          localStorage.getItem("fanniProCustomers") || "[]"
        );

    } catch {

      customers = [];

    }

    customers.forEach(customer => {

      const option =
        document.createElement("option");

      option.value = customer.id || "";

      option.textContent =
        customer.name +
        (customer.phone ? " — " + customer.phone : "");

      option.dataset.name =
        customer.name || "";

      option.dataset.phone =
        customer.phone || "";

      select.appendChild(option);

    });

  }


  document
    .getElementById("customerSelect")
    .addEventListener("change", function () {

      const option =
        this.options[this.selectedIndex];

      if (!option || !option.value) return;

      document.getElementById("customerName").value =
        option.dataset.name || "";

      document.getElementById("customerPhone").value =
        option.dataset.phone || "";

    });


  /* ================================
     REQUESTS
  ================================= */

  function loadRequests() {

    try {

      requests =
        JSON.parse(
          localStorage.getItem(STORAGE_KEY) || "[]"
        );

      if (!Array.isArray(requests)) {
        requests = [];
      }

    } catch {

      requests = [];

    }

    renderRequests();
    updateStats();

  }


  function saveRequests() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(requests)
    );

  }


  function generateRequestNumber() {

    let counter =
      parseInt(
        localStorage.getItem(COUNTER_KEY) || "0",
        10
      );

    counter++;

    localStorage.setItem(
      COUNTER_KEY,
      counter
    );

    const year =
      new Date().getFullYear();

    return (
      "SR-" +
      year +
      "-" +
      String(counter).padStart(4, "0")
    );

  }


  function setDefaultDate() {

    const today =
      new Date()
        .toISOString()
        .split("T")[0];

    document.getElementById("requestDate").value =
      today;

  }


  /* ================================
     FORM
  ================================= */

  document
    .getElementById("requestForm")
    .addEventListener("submit", function (event) {

      event.preventDefault();

      saveRequest();

    });


  function saveRequest() {

    const editId =
      document.getElementById("editId").value;

    const customerSelect =
      document.getElementById("customerSelect");

    const data = {

      id:
        editId ||
        Date.now().toString(),

      requestNumber:
        document.getElementById("requestNumber").value,

      date:
        document.getElementById("requestDate").value,

      customerId:
        customerSelect.value || "",

      customerName:
        document.getElementById("customerName").value.trim(),

      customerPhone:
        document.getElementById("customerPhone").value.trim(),

      serviceType:
        document.getElementById("serviceType").value,

      priority:
        document.getElementById("priority").value,

      appointment:
        document.getElementById("appointment").value,

      technician:
        document.getElementById("technician").value.trim(),

      description:
        document.getElementById("description").value.trim(),

      notes:
        document.getElementById("notes").value.trim(),

      status:
        document.getElementById("status").value,

      updatedAt:
        new Date().toISOString()

    };


    if (!data.customerName) {

      showMessage(
        "يرجى إدخال اسم العميل.",
        "error"
      );

      return;

    }


    if (!data.serviceType) {

      showMessage(
        "يرجى اختيار نوع الخدمة.",
        "error"
      );

      return;

    }


    if (!data.description) {

      showMessage(
        "يرجى كتابة وصف المشكلة أو طلب العميل.",
        "error"
      );

      return;

    }


    if (editId) {

      const index =
        requests.findIndex(
          item => String(item.id) === String(editId)
        );

      if (index !== -1) {

        requests[index] = {
          ...requests[index],
          ...data
        };

      }

      showMessage(
        "تم تحديث طلب الخدمة بنجاح.",
        "success"
      );

    } else {

      data.requestNumber =
        generateRequestNumber();

      data.createdAt =
        new Date().toISOString();

      requests.unshift(data);

      document.getElementById("requestNumber").value =
        data.requestNumber;

      showMessage(
        "تم حفظ طلب الخدمة بنجاح.",
        "success"
      );

    }


    saveRequests();
    renderRequests();
    updateStats();

    if (editId) {

      resetForm();

    } else {

      document.getElementById("requestForm").reset();

      document.getElementById("editId").value = "";

      setDefaultDate();

      document.getElementById("requestNumber").value =
        generatePreviewNumber();

      document.getElementById("priority").value =
        "عادية";

      document.getElementById("status").value =
        "جديد";

    }

  }


  function generatePreviewNumber() {

    let counter =
      parseInt(
        localStorage.getItem(COUNTER_KEY) || "0",
        10
      );

    const year =
      new Date().getFullYear();

    return (
      "SR-" +
      year +
      "-" +
      String(counter + 1).padStart(4, "0")
    );

  }


  function resetForm() {

    document
      .getElementById("requestForm")
      .reset();

    document.getElementById("editId").value = "";

    document.getElementById("formTitle").textContent =
      "إضافة طلب خدمة";

    document.getElementById("requestNumber").value =
      generatePreviewNumber();

    setDefaultDate();

    document.getElementById("priority").value =
      "عادية";

    document.getElementById("status").value =
      "جديد";

    document.getElementById("customerSelect").value =
      "";

  }


  /* ================================
     EDIT
  ================================= */

  function editRequest(id) {

    const item =
      requests.find(
        request =>
          String(request.id) === String(id)
      );

    if (!item) return;


    document.getElementById("editId").value =
      item.id;

    document.getElementById("requestNumber").value =
      item.requestNumber || "";

    document.getElementById("requestDate").value =
      item.date || "";

    document.getElementById("customerSelect").value =
      item.customerId || "";

    document.getElementById("customerName").value =
      item.customerName || "";

    document.getElementById("customerPhone").value =
      item.customerPhone || "";

    document.getElementById("serviceType").value =
      item.serviceType || "";

    document.getElementById("priority").value =
      item.priority || "عادية";

    document.getElementById("status").value =
      item.status || "جديد";

    document.getElementById("appointment").value =
      item.appointment || "";

    document.getElementById("technician").value =
      item.technician || "";

    document.getElementById("description").value =
      item.description || "";

    document.getElementById("notes").value =
      item.notes || "";

    document.getElementById("formTitle").textContent =
      "تعديل طلب الخدمة";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ================================
     DELETE
  ================================= */

  function deleteRequest(id) {

    const item =
      requests.find(
        request =>
          String(request.id) === String(id)
      );

    if (!item) return;

    const confirmed =
      confirm(
        "هل أنت متأكد من حذف طلب " +
        (item.requestNumber || "") +
        "؟"
      );

    if (!confirmed) return;


    requests =
      requests.filter(
        request =>
          String(request.id) !== String(id)
      );

    saveRequests();

    renderRequests();
    updateStats();

    showMessage(
      "تم حذف الطلب.",
      "success"
    );

  }


  /* ================================
     STATUS
  ================================= */

  function nextStatus(id) {

    const item =
      requests.find(
        request =>
          String(request.id) === String(id)
      );

    if (!item) return;

    const statuses = [
      "جديد",
      "قيد التنفيذ",
      "مكتمل",
      "ملغي"
    ];

    const currentIndex =
      statuses.indexOf(item.status);

    const nextIndex =
      currentIndex === -1
        ? 0
        : (currentIndex + 1) % statuses.length;

    item.status =
      statuses[nextIndex];

    item.updatedAt =
      new Date().toISOString();

    saveRequests();

    renderRequests();
    updateStats();

  }


  /* ================================
     RENDER
  ================================= */

  function renderRequests() {

    const container =
      document.getElementById("requestsList");

    const search =
      (
        document.getElementById("search").value ||
        ""
      ).trim().toLowerCase();

    const statusFilter =
      document.getElementById("statusFilter").value;


    let filtered =
      [...requests];


    if (search) {

      filtered =
        filtered.filter(item => {

          const text = [
            item.requestNumber,
            item.customerName,
            item.customerPhone,
            item.serviceType,
            item.technician,
            item.description
          ]
            .join(" ")
            .toLowerCase();

          return text.includes(search);

        });

    }


    if (statusFilter) {

      filtered =
        filtered.filter(
          item =>
            item.status === statusFilter
        );

    }


    if (!filtered.length) {

      container.innerHTML = `
        <div class="empty">
          لا توجد طلبات خدمة مطابقة.
        </div>
      `;

      return;

    }


    container.innerHTML =
      filtered
        .map(item => createRequestHTML(item))
        .join("");

  }


  function createRequestHTML(item) {

    const statusClass =
      getStatusClass(item.status);

    const priorityClass =
      getPriorityClass(item.priority);


    const appointmentText =
      item.appointment
        ? formatDateTime(item.appointment)
        : "غير محدد";


    return `

      <div class="request">

        <div class="request-top">

          <div class="request-number">
            ${escapeHTML(item.requestNumber || "بدون رقم")}
          </div>

          <div>

            <span class="badge ${statusClass}">
              ${escapeHTML(item.status || "جديد")}
            </span>

          </div>

        </div>


        <div class="request-info">

          <div>
            العميل:
            <strong>
              ${escapeHTML(item.customerName || "-")}
            </strong>
          </div>

          <div>
            الهاتف:
            <strong>
              ${escapeHTML(item.customerPhone || "-")}
            </strong>
          </div>

          <div>
            الخدمة:
            <strong>
              ${escapeHTML(item.serviceType || "-")}
            </strong>
          </div>

          <div>
            الأولوية:
            <strong class="${priorityClass}">
              ${escapeHTML(item.priority || "-")}
            </strong>
          </div>

          <div>
            موعد الخدمة:
            <strong>
              ${escapeHTML(appointmentText)}
            </strong>
          </div>

          <div>
            الفني:
            <strong>
              ${escapeHTML(item.technician || "-")}
            </strong>
          </div>

        </div>


        <div class="description">
          ${escapeHTML(item.description || "")}
        </div>


        ${
          item.notes
            ? `
              <div class="description">
                <strong>ملاحظات:</strong><br>
                ${escapeHTML(item.notes)}
              </div>
            `
            : ""
        }


        <div class="request-actions">

          <button
            class="btn btn-primary"
            onclick="editRequest('${escapeJS(item.id)}')">
            تعديل
          </button>

          <button
            class="btn btn-secondary"
            onclick="nextStatus('${escapeJS(item.id)}')">
            تغيير الحالة
          </button>

          <button
            class="btn btn-danger"
            onclick="deleteRequest('${escapeJS(item.id)}')">
            حذف
          </button>

        </div>

      </div>

    `;

  }


  /* ================================
     STATS
  ================================= */

  function updateStats() {

    document.getElementById("totalCount").textContent =
      requests.length;

    document.getElementById("newCount").textContent =
      requests.filter(
        item => item.status === "جديد"
      ).length;

    document.getElementById("progressCount").textContent =
      requests.filter(
        item => item.status === "قيد التنفيذ"
      ).length;

    document.getElementById("doneCount").textContent =
      requests.filter(
        item => item.status === "مكتمل"
      ).length;

  }


  /* ================================
     HELPERS
  ================================= */

  function getStatusClass(status) {

    if (status === "قيد التنفيذ")
      return "status-progress";

    if (status === "مكتمل")
      return "status-done";

    if (status === "ملغي")
      return "status-cancelled";

    return "status-new";

  }


  function getPriorityClass(priority) {

    if (priority === "متوسطة")
      return "priority-medium";

    if (priority === "عاجلة")
      return "priority-urgent";

    if (priority === "طوارئ")
      return "priority-emergency";

    return "priority-normal";

  }


  function formatDateTime(value) {

    try {

      return new Date(value)
        .toLocaleString(
          "ar-JO",
          {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );

    } catch {

      return value;

    }

  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJS(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  function showMessage(text, type) {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message " + type;

    clearTimeout(
      window.messageTimer
    );

    window.messageTimer =
      setTimeout(() => {

        box.className =
          "message";

      }, 3500);

  }


  /* ================================
     AUTH STATE
  ================================= */

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (
        event === "SIGNED_OUT" ||
        !session
      ) {

        window.location.replace("login.html");

      }

    }
  );

</script>

</body>
</html>
