<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | فني برو</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top right, rgba(102,92,255,.2), transparent 35%),
        #050b1b;
      color: white;
      padding: 20px;
    }

    .box {
      width: min(450px, 100%);
      background: rgba(12,22,48,.95);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .logo span {
      color: #7168ff;
    }

    .subtitle {
      text-align: center;
      color: #91a0b8;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab {
      border: 0;
      padding: 13px;
      border-radius: 10px;
      background: rgba(255,255,255,.06);
      color: #9ba8bd;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    .tab.active {
      background: #665cff;
      color: white;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce4f1;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #09142d;
      color: white;
      outline: none;
      font-family: inherit;
      font-size: 15px;
    }

    input:focus {
      border-color: #7168ff;
    }

    .main-btn {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 12px;
      background: linear-gradient(135deg,#665cff,#8d5cff);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      margin-top: 5px;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .forgot {
      display: block;
      text-align: center;
      color: #938cff;
      margin-top: 17px;
      cursor: pointer;
      font-size: 14px;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: rgba(220,50,70,.12);
      border: 1px solid rgba(220,70,90,.25);
      color: #ffabb5;
    }

    .message.success {
      display: block;
      background: rgba(20,170,100,.12);
      border: 1px solid rgba(20,200,120,.25);
      color: #91efbd;
    }

    .register-only {
      display: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #8492a9;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    فني <span>برو</span>
  </div>

  <div class="subtitle">
    تسجيل الدخول وإدارة طلبات الصيانة
  </div>


  <div class="tabs">

    <button
      type="button"
      class="tab active"
      id="loginTab">
      تسجيل الدخول
    </button>

    <button
      type="button"
      class="tab"
      id="registerTab">
      إنشاء حساب
    </button>

  </div>


  <div id="message" class="message"></div>


  <form id="authForm">

    <!-- الاسم -->
    <div
      class="field register-only"
      id="nameField">

      <label for="fullName">
        الاسم الكامل
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="أدخل اسمك الكامل">

    </div>


    <!-- الهاتف -->
    <div
      class="field register-only"
      id="phoneField">

      <label for="phone">
        رقم الهاتف
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="0791234567">

    </div>


    <!-- البريد -->

    <div class="field">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="email"
        required>

    </div>


    <!-- كلمة المرور -->

    <div class="field">

      <label for="password">
        كلمة المرور
      </label>

      <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required>

    </div>


    <button
      type="submit"
      class="main-btn"
      id="submitBtn">

      تسجيل الدخول

    </button>

  </form>


  <span
    class="forgot"
    id="forgotPassword">

    نسيت كلمة المرور؟

  </span>


  <a
    href="index.html"
    class="back">

    ← العودة إلى الرئيسية

  </a>

</div>


<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://yesmnsztcqnhaqrcgpcs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTS
  ========================================= */

  const authForm =
    document.getElementById("authForm");

  const loginTab =
    document.getElementById("loginTab");

  const registerTab =
    document.getElementById("registerTab");

  const nameField =
    document.getElementById("nameField");

  const phoneField =
    document.getElementById("phoneField");

  const fullName =
    document.getElementById("fullName");

  const phone =
    document.getElementById("phone");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const submitBtn =
    document.getElementById("submitBtn");

  const message =
    document.getElementById("message");

  const forgotPassword =
    document.getElementById("forgotPassword");


  let mode = "login";


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(type, text) {

    message.className =
      "message " + type;

    message.innerHTML =
      text;

  }


  function clearMessage() {

    message.className =
      "message";

    message.innerHTML =
      "";

  }


  /* =========================================
     MODE
  ========================================= */

  function setMode(newMode) {

    mode = newMode;

    clearMessage();

    if (mode === "login") {

      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      nameField.style.display = "none";
      phoneField.style.display = "none";

      submitBtn.textContent =
        "تسجيل الدخول";

      forgotPassword.style.display =
        "block";

      password.autocomplete =
        "current-password";

    } else {

      loginTab.classList.remove("active");
      registerTab.classList.add("active");

      nameField.style.display =
        "block";

      phoneField.style.display =
        "block";

      submitBtn.textContent =
        "إنشاء الحساب";

      forgotPassword.style.display =
        "none";

      password.autocomplete =
        "new-password";

    }

  }


  loginTab.addEventListener(
    "click",
    () => setMode("login")
  );

  registerTab.addEventListener(
    "click",
    () => setMode("register")
  );


  /* =========================================
     ترجمة أخطاء Supabase
  ========================================= */

  function translateError(error) {

    const msg =
      error?.message || "";

    const lower =
      msg.toLowerCase();


    if (
      lower.includes("invalid login credentials")
    ) {
      return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
    }


    if (
      lower.includes("email not confirmed")
    ) {
      return "يجب تأكيد البريد الإلكتروني أولًا. افحص بريدك الإلكتروني ورسائل البريد غير المرغوب فيها.";
    }


    if (
      lower.includes("user already registered")
    ) {
      return "هذا البريد الإلكتروني مسجل مسبقًا. جرّب تسجيل الدخول.";
    }


    if (
      lower.includes("password should be at least")
    ) {
      return "كلمة المرور قصيرة جدًا. استخدم كلمة مرور أقوى.";
    }


    if (
      lower.includes("rate limit")
    ) {
      return "تم تجاوز عدد المحاولات مؤقتًا. انتظر قليلًا ثم حاول مرة أخرى.";
    }


    if (
      lower.includes("network")
    ) {
      return "تعذر الاتصال بالخادم. تحقق من اتصال الإنترنت.";
    }


    return msg || "حدث خطأ غير معروف.";

  }


  /* =========================================
     AUTH SUBMIT
  ========================================= */

  authForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();

      submitBtn.disabled = true;

      submitBtn.textContent =
        mode === "login"
          ? "جاري تسجيل الدخول..."
          : "جاري إنشاء الحساب...";


      try {

        /* ================================
           LOGIN
        ================================= */

        if (mode === "login") {

          const emailValue =
            email.value.trim();

          const passwordValue =
            password.value;


          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email:
                  emailValue,

                password:
                  passwordValue

              });


          if (error) {
            throw error;
          }


          if (!data?.user) {

            throw new Error(
              "لم يتم العثور على المستخدم."
            );

          }


          showMessage(
            "success",
            "تم تسجيل الدخول بنجاح. جاري فتح الموقع..."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 700);


          return;
        }


        /* ================================
           REGISTER
        ================================= */

        const nameValue =
          fullName.value.trim();

        const phoneValue =
          phone.value.trim();

        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;


        if (nameValue.length < 2) {

          throw new Error(
            "يرجى إدخال الاسم الكامل."
          );

        }


        if (
          !/^07[0-9]{8}$/.test(phoneValue)
        ) {

          throw new Error(
            "يرجى إدخال رقم هاتف أردني صحيح مثل 0791234567."
          );

        }


        if (passwordValue.length < 6) {

          throw new Error(
            "كلمة المرور يجب أن تكون 6 أحرف أو أكثر."
          );

        }


        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signUp({

              email:
                emailValue,

              password:
                passwordValue,

              options: {

                data: {

                  full_name:
                    nameValue,

                  phone:
                    phoneValue

                }

              }

            });


        if (error) {
          throw error;
        }


        /*
          إذا كانت Supabase تطلب تأكيد البريد
        */

        if (
          data?.user &&
          !data?.session
        ) {

          showMessage(
            "success",
            `
              تم إنشاء الحساب بنجاح.

              <br><br>

              تم إرسال رسالة تأكيد إلى بريدك الإلكتروني.

              <br>

              افتح الرسالة واضغط رابط التأكيد،
              ثم ارجع وسجّل الدخول.
            `
          );

        } else {

          showMessage(
            "success",
            "تم إنشاء الحساب وتسجيل الدخول بنجاح."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 900);

        }

      } catch (error) {

        console.error(
          "Authentication error:",
          error
        );

        showMessage(
          "error",
          translateError(error)
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          mode === "login"
            ? "تسجيل الدخول"
            : "إنشاء الحساب";

      }

    }
  );


  /* =========================================
     FORGOT PASSWORD
  ========================================= */

  forgotPassword.addEventListener(
    "click",
    async function() {

      clearMessage();

      const emailValue =
        email.value.trim();


      if (!emailValue) {

        showMessage(
          "error",
          "أدخل بريدك الإلكتروني أولًا ثم اضغط نسيت كلمة المرور."
        );

        email.focus();

        return;

      }


      try {

        forgotPassword.textContent =
          "جاري الإرسال...";


        const redirectUrl =
          window.location.origin +
          window.location.pathname;


        const {
          error
        } =
          await supabaseClient.auth
            .resetPasswordForEmail(
              emailValue,
              {
                redirectTo:
                  redirectUrl
              }
            );


        if (error) {
          throw error;
        }


        showMessage(
          "success",
          "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني."
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "error",
          translateError(error)
        );

      } finally {

        forgotPassword.textContent =
          "نسيت كلمة المرور؟";

      }

    }
  );


  /* =========================================
     إذا كان المستخدم مسجل الدخول مسبقًا
  ========================================= */

  async function checkSession() {

    try {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      if (data?.session?.user) {

        /*
          لا نحوله مباشرة حتى لا نسبب
          مشكلة أثناء اختبار صفحة الدخول.
        */

        showMessage(
          "success",
          "أنت مسجل الدخول بالفعل."
        );

      }

    } catch (error) {

      console.error(
        "Session check:",
        error
      );

    }

  }


  checkSession();

</script>

</body>
</html>
