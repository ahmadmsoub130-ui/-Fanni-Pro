<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>تسجيل الدخول | فني برو</title>

  <meta
    name="description"
    content="تسجيل الدخول وإنشاء حساب في منصة فني برو"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Tahoma,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #07111f,
          #101b35
        );

      min-height: 100vh;

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }


    .container {
      width: 100%;
      max-width: 460px;
    }


    .logo {
      text-align: center;

      font-size: 32px;

      font-weight: bold;

      color: #60a5fa;

      margin-bottom: 8px;
    }


    .subtitle {
      text-align: center;

      color: #94a3b8;

      margin-bottom: 25px;

      line-height: 1.7;
    }


    .card {
      background:
        rgba(255,255,255,0.06);

      border:
        1px solid rgba(255,255,255,0.1);

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.3);
    }


    /* =========================
       TABS
    ========================== */

    .tabs {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      background:
        rgba(255,255,255,0.05);

      padding: 5px;

      border-radius: 12px;

      margin-bottom: 22px;
    }


    .tab {
      padding: 12px;

      border: none;

      border-radius: 9px;

      background: transparent;

      color: #94a3b8;

      cursor: pointer;

      font-size: 15px;

      font-family: inherit;
    }


    .tab.active {
      background: #2563eb;

      color: white;

      font-weight: bold;
    }


    /* =========================
       FORM
    ========================== */

    .form {
      display: none;
    }


    .form.active {
      display: block;
    }


    .field {
      margin-bottom: 15px;
    }


    label {
      display: block;

      margin-bottom: 7px;

      color: #dbeafe;

      font-size: 14px;

      font-weight: bold;
    }


    input,
    select {
      width: 100%;

      padding: 14px;

      border: none;

      outline: none;

      border-radius: 10px;

      background: #f8fafc;

      color: #111827;

      font-size: 15px;

      font-family: inherit;
    }


    input:focus,
    select:focus {
      box-shadow:
        0 0 0 2px #3b82f6;
    }


    .password-wrapper {
      position: relative;
    }


    .password-wrapper input {
      padding-left: 48px;
    }


    .show-password {
      position: absolute;

      left: 10px;

      top: 50%;

      transform: translateY(-50%);

      background: transparent;

      border: none;

      color: #475569;

      cursor: pointer;

      font-size: 18px;
    }


    .main-btn {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      font-family: inherit;

      margin-top: 5px;
    }


    .main-btn:hover {
      background: #1d4ed8;
    }


    .main-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }


    /* =========================
       GOOGLE
    ========================== */

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 20px 0;

      color: #64748b;

      font-size: 13px;
    }


    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255,255,255,0.1);
    }


    .google-btn {
      width: 100%;

      padding: 13px;

      border-radius: 10px;

      border: 1px solid #d1d5db;

      background: white;

      color: #111827;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      font-family: inherit;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;
    }


    .google-btn:hover {
      background: #f3f4f6;
    }


    .google-icon {
      font-size: 20px;

      font-weight: bold;

      color: #4285f4;
    }


    /* =========================
       FORGOT PASSWORD
    ========================== */

    .forgot {
      display: block;

      text-align: center;

      margin-top: 15px;

      color: #60a5fa;

      cursor: pointer;

      font-size: 14px;
    }


    .forgot:hover {
      text-decoration: underline;
    }


    /* =========================
       MESSAGE
    ========================== */

    #message {
      display: none;

      padding: 13px;

      border-radius: 10px;

      margin-bottom: 18px;

      text-align: center;

      line-height: 1.7;

      font-size: 14px;
    }


    .success {
      display: block !important;

      background:
        rgba(16,185,129,0.15);

      border:
        1px solid rgba(16,185,129,0.4);

      color: #6ee7b7;
    }


    .error {
      display: block !important;

      background:
        rgba(239,68,68,0.15);

      border:
        1px solid rgba(239,68,68,0.4);

      color: #fca5a5;
    }


    .info {
      display: block !important;

      background:
        rgba(59,130,246,0.15);

      border:
        1px solid rgba(59,130,246,0.4);

      color: #93c5fd;
    }


    /* =========================
       HOME
    ========================== */

    .home-link {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #94a3b8;

      text-decoration: none;

      font-size: 14px;
    }


    .home-link:hover {
      color: white;
    }


    /* =========================
       FORGOT BOX
    ========================== */

    .forgot-box {
      display: none;
    }


    .forgot-box.active {
      display: block;
    }


    .back-login {
      display: block;

      text-align: center;

      margin-top: 15px;

      color: #60a5fa;

      cursor: pointer;

      font-size: 14px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
      }

      .logo {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="logo">
    فني برو
  </div>


  <div class="subtitle">
    خدمات الصيانة المنزلية والفنية بسهولة
  </div>


  <div class="card">


    <!-- =========================
         MESSAGE
    ========================== -->

    <div id="message"></div>


    <!-- =========================
         LOGIN / REGISTER
    ========================== -->

    <div id="authSection">


      <div class="tabs">

        <button
          class="tab active"
          id="loginTab"
          onclick="showLogin()"
        >
          تسجيل الدخول
        </button>


        <button
          class="tab"
          id="registerTab"
          onclick="showRegister()"
        >
          إنشاء حساب
        </button>

      </div>


      <!-- =========================
           LOGIN FORM
      ========================== -->

      <form
        id="loginForm"
        class="form active"
        onsubmit="login(event)"
      >


        <div class="field">

          <label>
            البريد الإلكتروني
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="example@email.com"
            required
            autocomplete="email"
          >

        </div>


        <div class="field">

          <label>
            كلمة المرور
          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="loginPassword"
              placeholder="أدخل كلمة المرور"
              required
              autocomplete="current-password"
            >


            <button
              type="button"
              class="show-password"
              onclick="togglePassword('loginPassword', this)"
            >
              👁
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="main-btn"
          id="loginButton"
        >
          تسجيل الدخول
        </button>


        <div class="divider">
          أو
        </div>


        <button
          type="button"
          class="google-btn"
          onclick="loginWithGoogle()"
        >

          <span class="google-icon">
            G
          </span>

          المتابعة باستخدام Google

        </button>


        <span
          class="forgot"
          onclick="showForgotPassword()"
        >
          نسيت كلمة المرور؟
        </span>


      </form>


      <!-- =========================
           REGISTER FORM
      ========================== -->

      <form
        id="registerForm"
        class="form"
        onsubmit="register(event)"
      >


        <div class="field">

          <label>
            الاسم الكامل
          </label>

          <input
            type="text"
            id="registerName"
            placeholder="الاسم الكامل"
            required
            autocomplete="name"
          >

        </div>


        <div class="field">

          <label>
            رقم الهاتف
          </label>

          <input
            type="tel"
            id="registerPhone"
            placeholder="07XXXXXXXX"
            required
            autocomplete="tel"
          >

        </div>


        <div class="field">

          <label>
            نوع الحساب
          </label>

          <select id="registerType">

            <option value="customer">
              عميل
            </option>

            <option value="technician">
              فني
            </option>

          </select>

        </div>


        <div
          class="field"
          id="specializationField"
          style="display:none;"
        >

          <label>
            التخصص
          </label>

          <select id="registerSpecialization">

            <option value="">
              اختر التخصص
            </option>

            <option value="تكييف وتبريد">
              تكييف وتبريد
            </option>

            <option value="كهرباء">
              كهرباء
            </option>

            <option value="سباكة">
              سباكة
            </option>

            <option value="صيانة أجهزة منزلية">
              صيانة أجهزة منزلية
            </option>

            <option value="نجارة">
              نجارة
            </option>

            <option value="دهان">
              دهان
            </option>

            <option value="صيانة عامة">
              صيانة عامة
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            البريد الإلكتروني
          </label>

          <input
            type="email"
            id="registerEmail"
            placeholder="example@email.com"
            required
            autocomplete="email"
          >

        </div>


        <div class="field">

          <label>
            كلمة المرور
          </label>


          <div class="password-wrapper">

            <input
              type="password"
              id="registerPassword"
              placeholder="6 أحرف على الأقل"
              minlength="6"
              required
              autocomplete="new-password"
            >


            <button
              type="button"
              class="show-password"
              onclick="togglePassword('registerPassword', this)"
            >
              👁
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="main-btn"
          id="registerButton"
        >
          إنشاء الحساب
        </button>


        <div class="divider">
          أو
        </div>


        <button
          type="button"
          class="google-btn"
          onclick="registerWithGoogle()"
        >

          <span class="google-icon">
            G
          </span>

          إنشاء حساب باستخدام Google

        </button>


      </form>


    </div>


    <!-- =========================
         FORGOT PASSWORD
    ========================== -->

    <div
      id="forgotSection"
      class="forgot-box"
    >

      <h2
        style="
          margin-bottom:10px;
          text-align:center;
        "
      >
        استعادة كلمة المرور
      </h2>


      <p
        style="
          color:#94a3b8;
          line-height:1.7;
          text-align:center;
          margin-bottom:20px;
          font-size:14px;
        "
      >
        أدخل بريدك الإلكتروني وسنرسل لك رابطًا
        لإعادة تعيين كلمة المرور.
      </p>


      <form
        onsubmit="resetPassword(event)"
      >

        <div class="field">

          <label>
            البريد الإلكتروني
          </label>

          <input
            type="email"
            id="resetEmail"
            placeholder="example@email.com"
            required
            autocomplete="email"
          >

        </div>


        <button
          type="submit"
          class="main-btn"
          id="resetButton"
        >
          إرسال رابط الاستعادة
        </button>


      </form>


      <span
        class="back-login"
        onclick="showLogin()"
      >
        العودة إلى تسجيل الدخول
      </span>

    </div>


  </div>


  <a
    href="index.html"
    class="home-link"
  >
    العودة إلى الصفحة الرئيسية
  </a>


</div>


<script>


  /* =========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://yesmnsztcqnhaqrcgpcs.supabase.co";


  const SUPABASE_KEY =
    "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTS
  ========================================== */

  const message =
    document.getElementById("message");


  /* =========================================
     MESSAGE
  ========================================== */

  function showMessage(
    text,
    type = "info"
  ) {

    message.className = "";

    message.textContent = text;

    message.classList.add(type);

  }


  function hideMessage() {

    message.className = "";

    message.textContent = "";

  }


  /* =========================================
     TABS
  ========================================== */

  function showLogin() {

    hideMessage();

    document
      .getElementById("authSection")
      .style.display = "block";


    document
      .getElementById("forgotSection")
      .classList.remove("active");


    document
      .getElementById("loginForm")
      .classList.add("active");


    document
      .getElementById("registerForm")
      .classList.remove("active");


    document
      .getElementById("loginTab")
      .classList.add("active");


    document
      .getElementById("registerTab")
      .classList.remove("active");

  }


  function showRegister() {

    hideMessage();

    document
      .getElementById("authSection")
      .style.display = "block";


    document
      .getElementById("forgotSection")
      .classList.remove("active");


    document
      .getElementById("loginForm")
      .classList.remove("active");


    document
      .getElementById("registerForm")
      .classList.add("active");


    document
      .getElementById("loginTab")
      .classList.remove("active");


    document
      .getElementById("registerTab")
      .classList.add("active");

  }


  /* =========================================
     PASSWORD SHOW/HIDE
  ========================================== */

  function togglePassword(
    inputId,
    button
  ) {

    const input =
      document.getElementById(inputId);


    if (input.type === "password") {

      input.type = "text";

      button.textContent = "🙈";

    } else {

      input.type = "password";

      button.textContent = "👁";

    }

  }


  /* =========================================
     REGISTER TYPE
  ========================================== */

  document
    .getElementById("registerType")
    .addEventListener(
      "change",
      function() {

        const field =
          document.getElementById(
            "specializationField"
          );


        if (
          this.value === "technician"
        ) {

          field.style.display = "block";

        } else {

          field.style.display = "none";

        }

      }
    );


  /* =========================================
     LOGIN
  ========================================== */

  async function login(event) {

    event.preventDefault();

    hideMessage();


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("loginPassword")
        .value;


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled = true;

    button.textContent =
      "جاري تسجيل الدخول...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {
        throw error;
      }


      showMessage(
        "تم تسجيل الدخول بنجاح. جاري فتح حسابك...",
        "success"
      );


      await redirectUser(
        data.user
      );


    } catch (error) {

      console.error(error);


      let errorMessage =
        "حدث خطأ أثناء تسجيل الدخول.";


      if (
        error.message
          .toLowerCase()
          .includes("invalid login credentials")
      ) {

        errorMessage =
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      button.disabled = false;

      button.textContent =
        "تسجيل الدخول";

    }

  }


  /* =========================================
     GOOGLE LOGIN
  ========================================== */

  async function loginWithGoogle() {

    hideMessage();


    try {

      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider: "google",

            options: {

              redirectTo:
                "https://ahmadmsoub130-ui.github.io/-Fanni-Pro/login.html"

            }

          });


      if (error) {
        throw error;
      }


    } catch (error) {

      console.error(error);


      showMessage(
        "تعذر تسجيل الدخول باستخدام Google: " +
        error.message,
        "error"
      );

    }

  }


  /* =========================================
     GOOGLE REGISTER
  ========================================== */

  async function registerWithGoogle() {

    hideMessage();


    try {

      const {
        error
      } =
        await supabaseClient.auth
          .signInWithOAuth({

            provider: "google",

            options: {

              redirectTo:
                "https://ahmadmsoub130-ui.github.io/-Fanni-Pro/login.html",

              queryParams: {

                access_type: "offline",

                prompt: "select_account"

              }

            }

          });


      if (error) {
        throw error;
      }


    } catch (error) {

      console.error(error);


      showMessage(
        "تعذر إنشاء الحساب باستخدام Google: " +
        error.message,
        "error"
      );

    }

  }


  /* =========================================
     REGISTER
  ========================================== */

  async function register(event) {

    event.preventDefault();

    hideMessage();


    const name =
      document
        .getElementById("registerName")
        .value
        .trim();


    const phone =
      document
        .getElementById("registerPhone")
        .value
        .trim();


    const type =
      document
        .getElementById("registerType")
        .value;


    const specialization =
      document
        .getElementById(
          "registerSpecialization"
        )
        .value;


    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();


    const password =
      document
        .getElementById("registerPassword")
        .value;


    if (
      type === "technician" &&
      !specialization
    ) {

      showMessage(
        "يرجى اختيار تخصص الفني.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "registerButton"
      );


    button.disabled = true;

    button.textContent =
      "جاري إنشاء الحساب...";


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name: name,

                phone: phone,

                account_type: type,

                specialization:
                  specialization || null

              },

              emailRedirectTo:
                "https://ahmadmsoub130-ui.github.io/-Fanni-Pro/login.html"

            }

          });


      if (error) {
        throw error;
      }


      /*
        إذا كان Supabase لا يطلب تأكيد البريد
      */

      if (
        data.session &&
        data.user
      ) {

        /*
          إذا كان العميل:
          يدخل مباشرة.

          إذا كان فني:
          لا نعطيه role technician
          تلقائيًا هنا.

          قبول الفني يتم من نظام
          طلبات الفنيين/الإدارة.
        */

        showMessage(
          "تم إنشاء الحساب بنجاح. جاري فتح الحساب...",
          "success"
        );


        await redirectUser(
          data.user
        );


        return;

      }


      /*
        إذا كان تأكيد البريد مفعلاً
      */

      showMessage(
        "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتفعيل الحساب ثم سجّل الدخول.",
        "success"
      );


      button.disabled = false;

      button.textContent =
        "إنشاء الحساب";


    } catch (error) {

      console.error(error);


      let errorMessage =
        error.message ||
        "تعذر إنشاء الحساب.";


      if (
        errorMessage
          .toLowerCase()
          .includes("user already registered")
      ) {

        errorMessage =
          "هذا البريد الإلكتروني مسجل مسبقًا. جرّب تسجيل الدخول.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      button.disabled = false;

      button.textContent =
        "إنشاء الحساب";

    }

  }


  /* =========================================
     FORGOT PASSWORD
  ========================================== */

  function showForgotPassword() {

    hideMessage();


    document
      .getElementById("authSection")
      .style.display = "none";


    document
      .getElementById("forgotSection")
      .classList.add("active");


    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();


    if (email) {

      document
        .getElementById("resetEmail")
        .value = email;

    }

  }


  /* =========================================
     RESET PASSWORD
  ========================================== */

  async function resetPassword(event) {

    event.preventDefault();

    hideMessage();


    const email =
      document
        .getElementById("resetEmail")
        .value
        .trim();


    const button =
      document.getElementById(
        "resetButton"
      );


    button.disabled = true;

    button.textContent =
      "جاري الإرسال...";


    try {

      const {
        error
      } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {

              redirectTo:
                "https://ahmadmsoub130-ui.github.io/-Fanni-Pro/login.html"

            }
          );


      if (error) {
        throw error;
      }


      showMessage(
        "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",
        "success"
      );


    } catch (error) {

      console.error(error);


      showMessage(
        "تعذر إرسال رابط الاستعادة: " +
        error.message,
        "error"
      );

    }


    button.disabled = false;

    button.textContent =
      "إرسال رابط الاستعادة";

  }


  /* =========================================
     REDIRECT USER
  ========================================== */

  async function redirectUser(user) {

    if (!user) {

      window.location.href =
        "index.html";

      return;

    }


    try {

      /*
        فحص دور المستخدم
      */

      const {
        data: roleData,
        error
      } =
        await supabaseClient
          .from("user_roles")
          .select("role")
          .eq(
            "user_id",
            user.id
          )
          .maybeSingle();


      if (error) {

        console.error(
          "Role error:",
          error
        );

      }


      const role =
        roleData?.role;


      /*
        المدير
      */

      if (role === "admin") {

        window.location.href =
          "admin.html";

        return;

      }


      /*
        الفني
      */

      if (role === "technician") {

        window.location.href =
          "technician-dashboard.html";

        return;

      }


      /*
        المستخدم العادي
      */

      window.location.href =
        "index.html";


    } catch (error) {

      console.error(error);


      window.location.href =
        "index.html";

    }

  }


  /* =========================================
     CHECK EXISTING SESSION
  ========================================== */

  async function checkExistingSession() {

    try {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();


      const session =
        data?.session;


      if (session?.user) {

        await redirectUser(
          session.user
        );

      }

    } catch (error) {

      console.error(
        "Session error:",
        error
      );

    }

  }


  /* =========================================
     AUTH STATE
  ========================================== */

  supabaseClient.auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        /*
          تسجيل الدخول عبر Google
        */

        if (
          event ===
            "SIGNED_IN" &&
          session?.user
        ) {

          await redirectUser(
            session.user
          );

        }

      }
    );


  /* =========================================
     START
  ========================================== */

  checkExistingSession();

</script>
