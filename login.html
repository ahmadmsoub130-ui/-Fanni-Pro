<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>فني برو | تسجيل الدخول</title>

  <meta name="description" content="تسجيل الدخول وإنشاء حساب في منصة فني برو لإدارة أعمال الفنيين والخدمات.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(37, 99, 235, .25), transparent 35%),
        radial-gradient(circle at bottom left, rgba(14, 165, 233, .18), transparent 35%),
        #07111f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      box-shadow: 0 15px 40px rgba(14, 165, 233, .25);
    }

    .brand h1 {
      margin-top: 12px;
      font-size: 30px;
    }

    .brand p {
      margin-top: 7px;
      color: #9fb0c5;
      font-size: 14px;
    }

    .card {
      background: rgba(15, 28, 47, .92);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(15px);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #0a1728;
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: #8ea0b7;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .tab.active {
      background: #2563eb;
      color: #fff;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .title {
      font-size: 21px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #91a1b5;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #263a54;
      background: #091626;
      color: #fff;
      border-radius: 12px;
      padding: 0 14px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }

    select option {
      background: #091626;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-left: 52px;
    }

    .show-password {
      position: absolute;
      left: 8px;
      top: 8px;
      width: 34px;
      height: 32px;
      border: 0;
      background: transparent;
      color: #8ea0b7;
      cursor: pointer;
      font-size: 17px;
    }

    .main-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: .2s;
    }

    .main-btn:hover {
      transform: translateY(-1px);
      opacity: .95;
    }

    .main-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.7;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(22,163,74,.13);
      border: 1px solid rgba(22,163,74,.3);
      color: #86efac;
    }

    .message.error {
      background: rgba(220,38,38,.13);
      border: 1px solid rgba(220,38,38,.3);
      color: #fca5a5;
    }

    .forgot {
      text-align: center;
      margin-top: 15px;
    }

    .forgot button {
      background: none;
      border: 0;
      color: #60a5fa;
      cursor: pointer;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #718198;
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.7;
    }

    .security {
      margin-top: 17px;
      padding: 11px;
      border-radius: 11px;
      background: rgba(255,255,255,.035);
      color: #8292a8;
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body {
        padding: 13px;
      }

      .card {
        padding: 19px;
        border-radius: 21px;
      }

      .brand h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="logo">⚒</div>
    <h1>فني برو</h1>
    <p>إدارة أعمالك المهنية من مكان واحد</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab" onclick="showForm('login')">
        تسجيل الدخول
      </button>

      <button class="tab" id="registerTab" onclick="showForm('register')">
        إنشاء حساب
      </button>
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN -->

    <div id="loginForm" class="form active">

      <h2 class="title">مرحبًا بعودتك</h2>

      <p class="subtitle">
        سجّل الدخول للوصول إلى لوحة تحكم فني برو وبيانات عملك.
      </p>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="example@email.com"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>كلمة المرور</label>

        <div class="password-box">
          <input
            type="password"
            id="loginPassword"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('loginPassword', this)"
          >
            👁
          </button>
        </div>
      </div>

      <button
        class="main-btn"
        id="loginBtn"
        onclick="loginUser()"
      >
        تسجيل الدخول
      </button>

      <div class="forgot">
        <button onclick="forgotPassword()">
          نسيت كلمة المرور؟
        </button>
      </div>

    </div>


    <!-- REGISTER -->

    <div id="registerForm" class="form">

      <h2 class="title">إنشاء حساب جديد</h2>

      <p class="subtitle">
        أنشئ حسابك وابدأ بإدارة العملاء والخدمات والفواتير والمواعيد.
      </p>

      <div class="field">
        <label>الاسم الكامل</label>

        <input
          type="text"
          id="registerName"
          placeholder="مثال: أحمد الصعوب"
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label>رقم الهاتف</label>

        <input
          type="tel"
          id="registerPhone"
          placeholder="07XXXXXXXX"
          autocomplete="tel"
        >
      </div>

      <div class="field">
        <label>التخصص</label>

        <select id="registerSpecialization">

          <option value="تكييف وتبريد">
            تكييف وتبريد
          </option>

          <option value="كهرباء">
            كهرباء
          </option>

          <option value="سباكة">
            سباكة
          </option>

          <option value="صيانة عامة">
            صيانة عامة
          </option>

          <option value="أجهزة منزلية">
            أجهزة منزلية
          </option>

          <option value="كاميرات ومراقبة">
            كاميرات ومراقبة
          </option>

          <option value="شبكات وإنترنت">
            شبكات وإنترنت
          </option>

          <option value="تدفئة">
            تدفئة
          </option>

          <option value="صيانة سيارات">
            صيانة سيارات
          </option>

          <option value="نجارة">
            نجارة
          </option>

          <option value="دهان وتشطيبات">
            دهان وتشطيبات
          </option>

          <option value="تنظيف">
            تنظيف
          </option>

          <option value="حدائق ومسابح">
            حدائق ومسابح
          </option>

          <option value="خدمات منزلية">
            خدمات منزلية
          </option>

          <option value="مقاولات">
            مقاولات
          </option>

          <option value="أخرى">
            أخرى
          </option>

        </select>
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>

        <input
          type="email"
          id="registerEmail"
          placeholder="example@email.com"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label>كلمة المرور</label>

        <div class="password-box">

          <input
            type="password"
            id="registerPassword"
            placeholder="6 أحرف أو أكثر"
            autocomplete="new-password"
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('registerPassword', this)"
          >
            👁
          </button>

        </div>
      </div>

      <button
        class="main-btn"
        id="registerBtn"
        onclick="registerUser()"
      >
        إنشاء الحساب
      </button>

    </div>

    <div class="security">
      بيانات حسابك تُدار عبر نظام المصادقة في Supabase.
    </div>

  </div>

  <div class="footer">
    © 2026 فني برو — جميع الحقوق محفوظة
  </div>

</div>


<script>

  // =========================================
  // SUPABASE CONFIG
  // =========================================

  const SUPABASE_URL =
    "https://yesmnsztcqnhaqrcgpcs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_fUX7DXedpKF3OyBpDQ9kAQ_RRQpnIuB";

  const { createClient } = supabase;

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // =========================================
  // CHECK CURRENT SESSION
  // =========================================

  window.addEventListener("load", async () => {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {

      window.location.href = "index.html";

    }

  });


  // =========================================
  // SHOW FORM
  // =========================================

  function showForm(type) {

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    clearMessage();

    if (type === "login") {

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      loginTab.classList.add("active");
      registerTab.classList.remove("active");

    } else {

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      registerTab.classList.add("active");
      loginTab.classList.remove("active");

    }

  }


  // =========================================
  // MESSAGE
  // =========================================

  function showMessage(text, type = "error") {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message show " + type;

  }


  function clearMessage() {

    const box =
      document.getElementById("message");

    box.textContent = "";

    box.className = "message";

  }


  // =========================================
  // TOGGLE PASSWORD
  // =========================================

  function togglePassword(id, button) {

    const input =
      document.getElementById(id);

    if (input.type === "password") {

      input.type = "text";
      button.textContent = "🙈";

    } else {

      input.type = "password";
      button.textContent = "👁";

    }

  }


  // =========================================
  // REGISTER
  // =========================================

  async function registerUser() {

    clearMessage();

    const button =
      document.getElementById("registerBtn");

    const name =
      document.getElementById("registerName")
        .value.trim();

    const phone =
      document.getElementById("registerPhone")
        .value.trim();

    const specialization =
      document.getElementById("registerSpecialization")
        .value;

    const email =
      document.getElementById("registerEmail")
        .value.trim();

    const password =
      document.getElementById("registerPassword")
        .value;


    if (!name) {

      showMessage("اكتب الاسم الكامل.");

      return;

    }


    if (!email) {

      showMessage("اكتب البريد الإلكتروني.");

      return;

    }


    if (!password || password.length < 6) {

      showMessage(
        "كلمة المرور يجب أن تحتوي على 6 أحرف أو أكثر."
      );

      return;

    }


    button.disabled = true;
    button.textContent = "جاري إنشاء الحساب...";


    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {

            full_name: name,

            phone: phone,

            specialization: specialization

          }

        }

      });


      if (error) {

        throw error;

      }


      if (data.session) {

        showMessage(
          "تم إنشاء الحساب بنجاح. جارٍ فتح لوحة التحكم...",
          "success"
        );

        setTimeout(() => {

          window.location.href = "index.html";

        }, 1200);

      } else {

        showMessage(
          "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.",
          "success"
        );

        showForm("login");

        document.getElementById("loginEmail").value =
          email;

      }

    } catch (error) {

      console.error(error);

      showMessage(
        translateAuthError(error.message)
      );

    } finally {

      button.disabled = false;
      button.textContent = "إنشاء الحساب";

    }

  }


  // =========================================
  // LOGIN
  // =========================================

  async function loginUser() {

    clearMessage();

    const button =
      document.getElementById("loginBtn");

    const email =
      document.getElementById("loginEmail")
        .value.trim();

    const password =
      document.getElementById("loginPassword")
        .value;


    if (!email) {

      showMessage("اكتب البريد الإلكتروني.");

      return;

    }


    if (!password) {

      showMessage("اكتب كلمة المرور.");

      return;

    }


    button.disabled = true;
    button.textContent = "جاري تسجيل الدخول...";


    try {

      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        throw error;

      }


      if (data.session) {

        showMessage(
          "تم تسجيل الدخول بنجاح. جارٍ فتح لوحة التحكم...",
          "success"
        );

        setTimeout(() => {

          window.location.href = "index.html";

        }, 800);

      }

    } catch (error) {

      console.error(error);

      showMessage(
        translateAuthError(error.message)
      );

    } finally {

      button.disabled = false;
      button.textContent = "تسجيل الدخول";

    }

  }


  // =========================================
  // FORGOT PASSWORD
  // =========================================

  async function forgotPassword() {

    const email =
      document.getElementById("loginEmail")
        .value.trim();


    if (!email) {

      showMessage(
        "اكتب بريدك الإلكتروني أولًا ثم اضغط نسيت كلمة المرور."
      );

      return;

    }


    try {

      const { error } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                window.location.pathname
            }
          );


      if (error) {

        throw error;

      }


      showMessage(
        "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",
        "success"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        translateAuthError(error.message)
      );

    }

  }


  // =========================================
  // ERROR TRANSLATION
  // =========================================

  function translateAuthError(message) {

    const text =
      String(message || "").toLowerCase();


    if (
      text.includes("invalid login credentials")
    ) {

      return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

    }


    if (
      text.includes("user already registered")
    ) {

      return "هذا البريد الإلكتروني مسجل مسبقًا.";

    }


    if (
      text.includes("email not confirmed")
    ) {

      return "يجب تأكيد بريدك الإلكتروني أولًا.";

    }


    if (
      text.includes("password should be at least")
    ) {

      return "كلمة المرور قصيرة جدًا.";

    }


    if (
      text.includes("rate limit")
    ) {

      return "تم تجاوز عدد المحاولات. حاول مرة أخرى لاحقًا.";

    }


    if (
      text.includes("network")
    ) {

      return "تعذر الاتصال بالإنترنت. تحقق من الاتصال وحاول مرة أخرى.";

    }


    return message || "حدث خطأ غير متوقع.";

  }

</script>

</body>
</html>
