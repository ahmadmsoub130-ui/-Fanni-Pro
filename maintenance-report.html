<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقارير الصيانة | فني برو</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f7fb;
    color:#172033
}
header{
    background:#0f172a;
    color:#fff;
    padding:18px 20px
}
.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px
}
.logo{font-size:23px;font-weight:bold}
nav{
    display:flex;
    gap:7px;
    flex-wrap:wrap
}
nav a{
    color:#dbeafe;
    text-decoration:none;
    padding:8px 10px;
    border-radius:8px;
    font-size:13px
}
nav a:hover{background:#1e293b}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px
}
.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap
}
h1{margin:0 0 7px}
.subtitle{color:#64748b}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin:20px 0
}
.card{
    background:#fff;
    border-radius:14px;
    padding:18px;
    box-shadow:0 4px 18px #0000000d;
    margin-bottom:20px
}
.stat-number{
    font-size:27px;
    font-weight:bold;
    margin-top:7px
}
.stat-label{color:#64748b;font-size:14px}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px
}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-weight:bold;font-size:14px}

input,select,textarea{
    width:100%;
    border:1px solid #d8dee9;
    border-radius:9px;
    padding:11px;
    font-size:14px;
    background:#fff
}
textarea{min-height:90px;resize:vertical}

button{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px
}
.btn-primary{background:#2563eb;color:#fff}
.btn-dark{background:#0f172a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-edit{background:#f59e0b;color:#fff}
.btn-whatsapp{background:#16a34a;color:#fff}
.btn-light{background:#e2e8f0;color:#0f172a}

button:hover{opacity:.9}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px
}
.toolbar input{max-width:400px}

.table-wrap{overflow-x:auto}

table{
    width:100%;
    border-collapse:collapse
}
th,td{
    padding:10px;
    border-bottom:1px solid #e5e7eb;
    text-align:right;
    white-space:nowrap
}
th{background:#f8fafc}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold
}
.badge-new{background:#dbeafe;color:#1e40af}
.badge-work{background:#fef3c7;color:#92400e}
.badge-done{background:#dcfce7;color:#166534}
.badge-cancel{background:#e5e7eb;color:#475569}

.equipment-box{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:12px;
    line-height:1.8;
    display:none
}

.empty{
    text-align:center;
    padding:30px;
    color:#64748b
}

.toast{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#0f172a;
    color:#fff;
    padding:13px 18px;
    border-radius:10px;
    display:none;
    z-index:100
}

@media(max-width:850px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .form-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
    .grid,.form-grid{grid-template-columns:1fr}
    nav{display:none}
}

@media print{
    header,.toolbar,.form-card,.no-print{
        display:none!important
    }
    body{background:#fff}
    .container{margin:0;max-width:none}
    .card{box-shadow:none}
}
</style>
</head>

<body>

<header>
<div class="header-inner">

<div class="logo">⚒ فني برو</div>

<nav>
<a href="index.html">الرئيسية</a>
<a href="customers.html">العملاء</a>
<a href="service-request.html">الطلبات</a>
<a href="maintenance-report.html">تقارير الصيانة</a>
<a href="equipment.html">الأجهزة</a>
<a href="quote.html">العروض</a>
<a href="invoice.html">الفواتير</a>
<a href="appointments.html">المواعيد</a>
<a href="expenses.html">المصاريف</a>
</nav>

</div>
</header>

<main class="container">

<div class="page-title">

<div>
<h1>تقارير الصيانة</h1>
<div class="subtitle">إنشاء تقارير الخدمة والصيانة ومشاركتها مع العملاء</div>
</div>

<button class="btn-primary" onclick="resetForm()">+ تقرير جديد</button>

</div>

<div class="grid">

<div class="card">
<div class="stat-label">إجمالي التقارير</div>
<div class="stat-number" id="totalReports">0</div>
</div>

<div class="card">
<div class="stat-label">جديدة</div>
<div class="stat-number" id="newReports">0</div>
</div>

<div class="card">
<div class="stat-label">قيد التنفيذ</div>
<div class="stat-number" id="workReports">0</div>
</div>

<div class="card">
<div class="stat-label">مكتملة</div>
<div class="stat-number" id="doneReports">0</div>
</div>

</div>

<div class="card form-card">

<h2 id="formTitle">إنشاء تقرير صيانة</h2>

<form id="reportForm">

<input type="hidden" id="editId">

<div class="form-grid">

<div class="field">
<label>رقم التقرير</label>
<input id="reportNumber" readonly>
</div>

<div class="field">
<label>التاريخ</label>
<input type="date" id="reportDate" required>
</div>

<div class="field">
<label>العميل المسجل</label>
<select id="customerSelect">
<option value="">-- اختر عميلًا --</option>
</select>
</div>

<div class="field">
<label>اسم العميل</label>
<input id="customerName" required>
</div>

<div class="field">
<label>رقم الهاتف</label>
<input id="customerPhone">
</div>

<div class="field">
<label>نوع الخدمة</label>
<select id="serviceType">
<option>تكييف وتبريد</option>
<option>كهرباء</option>
<option>سباكة</option>
<option>صيانة عامة</option>
<option>أجهزة منزلية</option>
<option>كاميرات ومراقبة</option>
<option>شبكات وإنترنت</option>
<option>تدفئة</option>
<option>صيانة سيارات</option>
<option>نجارة</option>
<option>دهان وتشطيبات</option>
<option>تنظيف</option>
<option>حدائق ومسابح</option>
<option>خدمات منزلية</option>
<option>مقاولات</option>
<option>أخرى</option>
</select>
</div>

<div class="field">
<label>الجهاز / المعدة</label>
<select id="equipmentSelect">
<option value="">-- اختر الجهاز --</option>
</select>
</div>

<div class="field">
<label>الفني</label>
<input id="technician">
</div>

<div class="field">
<label>الحالة</label>
<select id="status">
<option>جديد</option>
<option>قيد التنفيذ</option>
<option>مكتمل</option>
<option>ملغي</option>
</select>
</div>

<div class="field full">
<div class="equipment-box" id="equipmentBox"></div>
</div>

<div class="field full">
<label>المشكلة</label>
<textarea id="problem" required></textarea>
</div>

<div class="field full">
<label>التشخيص</label>
<textarea id="diagnosis"></textarea>
</div>

<div class="field full">
<label>الأعمال المنفذة</label>
<textarea id="workDone"></textarea>
</div>

<div class="field">
<label>قطع الغيار</label>
<textarea id="parts"></textarea>
</div>

<div class="field">
<label>القياسات</label>
<textarea id="measurement"></textarea>
</div>

<div class="field">
<label>التكلفة د.أ</label>
<input type="number" id="cost" min="0" step="0.01" value="0">
</div>

<div class="field">
<label>المدفوع د.أ</label>
<input type="number" id="paid" min="0" step="0.01" value="0">
</div>

<div class="field full">
<label>ملاحظات</label>
<textarea id="notes"></textarea>
</div>

</div>

<div class="actions">

<button type="submit" class="btn-primary">
حفظ التقرير
</button>

<button type="button" class="btn-light" onclick="resetForm()">
إلغاء
</button>

</div>

</form>

</div>

<div class="card">

<div class="toolbar">

<input
id="searchInput"
placeholder="ابحث برقم التقرير أو اسم العميل أو الهاتف..."
oninput="renderReports()">

<select id="statusFilter" onchange="renderReports()">
<option value="">كل الحالات</option>
<option>جديد</option>
<option>قيد التنفيذ</option>
<option>مكتمل</option>
<option>ملغي</option>
</select>

</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>رقم التقرير</th>
<th>التاريخ</th>
<th>العميل</th>
<th>الخدمة</th>
<th>المشكلة</th>
<th>التكلفة</th>
<th>الحالة</th>
<th>الإجراءات</th>
</tr>
</thead>

<tbody id="reportTable"></tbody>

</table>

</div>

</div>

</main>

<div class="toast" id="toast"></div>

<script>

const STORAGE_KEY="fanniProMaintenanceReports";
const COUNTER_KEY="fanniProMaintenanceReportCounter";
const CUSTOMER_KEY="fanniProCustomers";
const EQUIPMENT_KEY="fanniProEquipment";

let reports=[];
let customers=[];
let equipment=[];

function loadData(){

    reports=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    customers=JSON.parse(localStorage.getItem(CUSTOMER_KEY)||"[]");
    equipment=JSON.parse(localStorage.getItem(EQUIPMENT_KEY)||"[]");

    renderCustomers();
    renderReports();
    updateStats();

}

function saveData(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(reports));
}

function today(){
    return new Date().toISOString().split("T")[0];
}

function money(value){
    return Number(value||0).toFixed(2)+" د.أ";
}

function escapeHTML(value){

    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function getNextReportNumber(){

    let counter=Number(localStorage.getItem(COUNTER_KEY)||0)+1;

    localStorage.setItem(COUNTER_KEY,counter);

    return "MR-"+new Date().getFullYear()+"-"+String(counter).padStart(4,"0");

}

function renderCustomers(){

    const select=document.getElementById("customerSelect");

    select.innerHTML='<option value="">-- اختر عميلًا --</option>';

    customers.forEach(c=>{

        const option=document.createElement("option");

        option.value=c.id;

        option.textContent=c.name+" - "+(c.phone||"بدون رقم");

        select.appendChild(option);

    });

}

document.getElementById("customerSelect").addEventListener("change",function(){

    const customer=customers.find(c=>String(c.id)===String(this.value));

    if(!customer)return;

    document.getElementById("customerName").value=customer.name||"";
    document.getElementById("customerPhone").value=customer.phone||"";

    renderEquipment();

});

function renderEquipment(){

    const select=document.getElementById("equipmentSelect");

    const customerId=document.getElementById("customerSelect").value;
    const customerName=document.getElementById("customerName").value.trim();

    select.innerHTML='<option value="">-- اختر الجهاز --</option>';

    const filtered=equipment.filter(e=>{

        if(customerId && String(e.customerId)===String(customerId))
            return true;

        if(customerName && String(e.customerName||"").trim()===customerName)
            return true;

        return false;

    });

    filtered.forEach(e=>{

        const option=document.createElement("option");

        option.value=e.id;

        option.textContent=
            (e.equipmentType||"جهاز")+
            (e.brand?" - "+e.brand:"")+
            (e.model?" "+e.model:"");

        select.appendChild(option);

    });

}

document.getElementById("customerName").addEventListener("input",renderEquipment);

document.getElementById("equipmentSelect").addEventListener("change",function(){

    const item=equipment.find(e=>String(e.id)===String(this.value));

    const box=document.getElementById("equipmentBox");

    if(!item){

        box.style.display="none";
        box.innerHTML="";

        return;

    }

    box.style.display="block";

    box.innerHTML=`
    <strong>الجهاز:</strong> ${escapeHTML(item.equipmentType||"")}<br>
    <strong>الماركة:</strong> ${escapeHTML(item.brand||"غير محددة")}<br>
    <strong>الموديل:</strong> ${escapeHTML(item.model||"غير محدد")}<br>
    <strong>الرقم التسلسلي:</strong> ${escapeHTML(item.serialNumber||"غير محدد")}<br>
    <strong>الموقع:</strong> ${escapeHTML(item.location||"غير محدد")}
    `;

});

document.getElementById("reportForm").addEventListener("submit",function(e){

    e.preventDefault();

    const editId=document.getElementById("editId").value;

    const old=editId
        ? reports.find(x=>String(x.id)===String(editId))
        : null;

    const item={

        id:editId||Date.now().toString(),

        reportNumber:document.getElementById("reportNumber").value,

        date:document.getElementById("reportDate").value,

        customerId:document.getElementById("customerSelect").value,

        customerName:document.getElementById("customerName").value.trim(),

        customerPhone:document.getElementById("customerPhone").value.trim(),

        serviceType:document.getElementById("serviceType").value,

        equipmentId:document.getElementById("equipmentSelect").value,

        technician:document.getElementById("technician").value.trim(),

        status:document.getElementById("status").value,

        measurement:document.getElementById("measurement").value.trim(),

        problem:document.getElementById("problem").value.trim(),

        diagnosis:document.getElementById("diagnosis").value.trim(),

        workDone:document.getElementById("workDone").value.trim(),

        parts:document.getElementById("parts").value.trim(),

        cost:Number(document.getElementById("cost").value)||0,

        paid:Number(document.getElementById("paid").value)||0,

        notes:document.getElementById("notes").value.trim(),

        createdAt:old?.createdAt||new Date().toISOString(),

        updatedAt:new Date().toISOString()

    };

    if(editId){

        const index=reports.findIndex(x=>String(x.id)===String(editId));

        if(index!==-1) reports[index]=item;

        showToast("تم تعديل التقرير");

    }else{

        reports.unshift(item);

        showToast("تم حفظ التقرير");

    }

    saveData();

    resetForm();

    renderReports();

    updateStats();

});

function resetForm(){

    document.getElementById("reportForm").reset();

    document.getElementById("editId").value="";

    document.getElementById("reportNumber").value=getNextReportNumber();

    document.getElementById("reportDate").value=today();

    document.getElementById("status").value="جديد";

    document.getElementById("cost").value=0;

    document.getElementById("paid").value=0;

    document.getElementById("formTitle").textContent="إنشاء تقرير صيانة";

    document.getElementById("equipmentSelect").innerHTML=
        '<option value="">-- اختر الجهاز --</option>';

    document.getElementById("equipmentBox").style.display="none";

}

function editReport(id){

    const item=reports.find(x=>String(x.id)===String(id));

    if(!item)return;

    document.getElementById("editId").value=item.id;
    document.getElementById("reportNumber").value=item.reportNumber;
    document.getElementById("reportDate").value=item.date||"";
    document.getElementById("customerSelect").value=item.customerId||"";
    document.getElementById("customerName").value=item.customerName||"";
    document.getElementById("customerPhone").value=item.customerPhone||"";
    document.getElementById("serviceType").value=item.serviceType||"تكييف وتبريد";
    document.getElementById("technician").value=item.technician||"";
    document.getElementById("status").value=item.status||"جديد";
    document.getElementById("measurement").value=item.measurement||"";
    document.getElementById("problem").value=item.problem||"";
    document.getElementById("diagnosis").value=item.diagnosis||"";
    document.getElementById("workDone").value=item.workDone||"";
    document.getElementById("parts").value=item.parts||"";
    document.getElementById("cost").value=item.cost||0;
    document.getElementById("paid").value=item.paid||0;
    document.getElementById("notes").value=item.notes||"";

    renderEquipment();

    document.getElementById("equipmentSelect").value=item.equipmentId||"";

    document.getElementById("equipmentSelect").dispatchEvent(new Event("change"));

    document.getElementById("formTitle").textContent="تعديل تقرير الصيانة";

    window.scrollTo({top:0,behavior:"smooth"});

}

function deleteReport(id){

    if(!confirm("هل تريد حذف التقرير؟"))return;

    reports=reports.filter(x=>String(x.id)!==String(id));

    saveData();
    renderReports();
    updateStats();

    showToast("تم حذف التقرير");

}

function normalizeJordanPhone(phone){

    let p=String(phone||"").trim().replace(/[^\d+]/g,"");

    if(p.startsWith("+962"))return p.substring(1);

    if(p.startsWith("00962"))return p.substring(2);

    if(p.startsWith("962"))return p;

    if(p.startsWith("07"))return "962"+p.substring(1);

    return p.replace(/\D/g,"");

}

function sendReportWhatsApp(id){

    const item=reports.find(x=>String(x.id)===String(id));

    if(!item)return;

    const phone=normalizeJordanPhone(item.customerPhone);

    if(!phone){

        alert("لا يوجد رقم هاتف صالح للعميل في هذا التقرير.");

        return;

    }

    const equipmentItem=
        equipment.find(e=>String(e.id)===String(item.equipmentId));

    const paid=Number(item.paid)||0;
    const cost=Number(item.cost)||0;
    const due=Math.max(0,cost-paid);

    const equipmentText=equipmentItem
        ? `${equipmentItem.equipmentType||""}${equipmentItem.brand?" - "+equipmentItem.brand:""}${equipmentItem.model?" "+equipmentItem.model:""}`
        : "غير محدد";

    const message=
`تقرير صيانة - فني برو

رقم التقرير: ${item.reportNumber||""}
العميل: ${item.customerName||""}
الهاتف: ${item.customerPhone||""}
التاريخ: ${item.date||""}
الخدمة: ${item.serviceType||""}
الجهاز: ${equipmentText}
الحالة: ${item.status||""}

المشكلة:
${item.problem||"غير محددة"}

التشخيص:
${item.diagnosis||"غير محدد"}

الأعمال المنفذة:
${item.workDone||"لم يتم تسجيلها"}

قطع الغيار:
${item.parts||"لا يوجد"}

القياسات:
${item.measurement||"لا يوجد"}

التكلفة: ${money(cost)}
المدفوع: ${money(paid)}
المتبقي: ${money(due)}

ملاحظات:
${item.notes||"لا يوجد"}

تم إنشاء التقرير بواسطة فني برو.`;

    const url="https://wa.me/"+phone+"?text="+encodeURIComponent(message);

    window.open(url,"_blank");

}

function printReport(id){

    const item=reports.find(x=>String(x.id)===String(id));

    if(!item)return;

    const equipmentItem=
        equipment.find(e=>String(e.id)===String(item.equipmentId));

    const paid=Number(item.paid)||0;
    const cost=Number(item.cost)||0;
    const due=Math.max(0,cost-paid);

    const win=window.open("","_blank");

    win.document.write(`
    <!DOCTYPE html>
    <html lang="ar" dir="rtl">

    <head>

    <meta charset="UTF-8">

    <title>${escapeHTML(item.reportNumber)}</title>

    <style>

    body{
        font-family:Arial,Tahoma,sans-serif;
        padding:35px;
        color:#111
    }

    h1{text-align:center}

    .box{
        border:1px solid #ddd;
        padding:15px;
        margin:15px 0;
        border-radius:8px;
        line-height:1.8
    }

    .title{
        font-size:18px;
        font-weight:bold;
        margin-bottom:7px
    }

    </style>

    </head>

    <body>

    <h1>فني برو</h1>

    <h2 style="text-align:center">
    تقرير صيانة
    </h2>

    <div class="box">

    <strong>رقم التقرير:</strong>
    ${escapeHTML(item.reportNumber)}<br>

    <strong>التاريخ:</strong>
    ${escapeHTML(item.date)}<br>

    <strong>العميل:</strong>
    ${escapeHTML(item.customerName)}<br>

    <strong>الهاتف:</strong>
    ${escapeHTML(item.customerPhone)}<br>

    <strong>الخدمة:</strong>
    ${escapeHTML(item.serviceType)}<br>

    <strong>الفني:</strong>
    ${escapeHTML(item.technician)}<br>

    <strong>الحالة:</strong>
    ${escapeHTML(item.status)}

    </div>

    <div class="box">

    <div class="title">الجهاز / المعدة</div>

    ${equipmentItem
        ? `
        النوع: ${escapeHTML(equipmentItem.equipmentType||"")}<br>
        الماركة: ${escapeHTML(equipmentItem.brand||"غير محددة")}<br>
        الموديل: ${escapeHTML(equipmentItem.model||"غير محدد")}<br>
        الرقم التسلسلي: ${escapeHTML(equipmentItem.serialNumber||"غير محدد")}<br>
        الموقع: ${escapeHTML(equipmentItem.location||"غير محدد")}
        `
        : "غير محدد"
    }

    </div>

    <div class="box">
    <div class="title">المشكلة</div>
    ${escapeHTML(item.problem||"غير محددة")}
    </div>

    <div class="box">
    <div class="title">التشخيص</div>
    ${escapeHTML(item.diagnosis||"غير محدد")}
    </div>

    <div class="box">
    <div class="title">الأعمال المنفذة</div>
    ${escapeHTML(item.workDone||"لم يتم تسجيلها")}
    </div>

    <div class="box">
    <div class="title">قطع الغيار</div>
    ${escapeHTML(item.parts||"لا يوجد")}
    </div>

    <div class="box">
    <div class="title">القياسات</div>
    ${escapeHTML(item.measurement||"لا يوجد")}
    </div>

    <div class="box">

    <div class="title">البيانات المالية</div>

    التكلفة: ${money(cost)}<br>
    المدفوع: ${money(paid)}<br>
    المتبقي: ${money(due)}

    </div>

    <div class="box">

    <div class="title">ملاحظات</div>

    ${escapeHTML(item.notes||"لا يوجد")}

    </div>

    <script>
    window.onload=function(){window.print()}
    <\/script>

    </body>
    </html>
    `);

    win.document.close();

}

function statusBadge(status){

    if(status==="مكتمل")
        return '<span class="badge badge-done">مكتمل</span>';

    if(status==="قيد التنفيذ")
        return '<span class="badge badge-work">قيد التنفيذ</span>';

    if(status==="ملغي")
        return '<span class="badge badge-cancel">ملغي</span>';

    return '<span class="badge badge-new">جديد</span>';

}

function renderReports(){

    const search=document.getElementById("searchInput").value.toLowerCase().trim();

    const filter=document.getElementById("statusFilter").value;

    const filtered=reports.filter(item=>{

        const text=[
            item.reportNumber,
            item.customerName,
            item.customerPhone,
            item.serviceType,
            item.technician,
            item.problem
        ].join(" ").toLowerCase();

        return (!search||text.includes(search))
            &&(!filter||item.status===filter);

    });

    const tbody=document.getElementById("reportTable");

    if(!filtered.length){

        tbody.innerHTML=`
        <tr>
        <td colspan="8" class="empty">
        لا توجد تقارير
        </td>
        </tr>`;

        return;

    }

    tbody.innerHTML=filtered.map(item=>`

    <tr>

    <td>
    <strong>${escapeHTML(item.reportNumber)}</strong>
    </td>

    <td>${escapeHTML(item.date)}</td>

    <td>
    ${escapeHTML(item.customerName)}
    <br>
    <small>${escapeHTML(item.customerPhone||"")}</small>
    </td>

    <td>${escapeHTML(item.serviceType)}</td>

    <td>
    ${escapeHTML(item.problem||"")}
    </td>

    <td>
    ${money(item.cost)}
    </td>

    <td>
    ${statusBadge(item.status)}
    </td>

    <td>

    <div class="actions no-print">

    <button
    class="btn-edit"
    onclick="editReport('${item.id}')">
    تعديل
    </button>

    <button
    class="btn-whatsapp"
    onclick="sendReportWhatsApp('${item.id}')">
    واتساب
    </button>

    <button
    class="btn-dark"
    onclick="printReport('${item.id}')">
    طباعة
    </button>

    <button
    class="btn-danger"
    onclick="deleteReport('${item.id}')">
    حذف
    </button>

    </div>

    </td>

    </tr>

    `).join("");

}

function updateStats(){

    document.getElementById("totalReports").textContent=reports.length;

    document.getElementById("newReports").textContent=
        reports.filter(x=>x.status==="جديد").length;

    document.getElementById("workReports").textContent=
        reports.filter(x=>x.status==="قيد التنفيذ").length;

    document.getElementById("doneReports").textContent=
        reports.filter(x=>x.status==="مكتمل").length;

}

function showToast(message){

    const toast=document.getElementById("toast");

    toast.textContent=message;
    toast.style.display="block";

    setTimeout(()=>{
        toast.style.display="none";
    },2500);

}

loadData();
resetForm();

</script>

</body>
</html>
